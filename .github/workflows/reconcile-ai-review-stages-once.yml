name: Reconcile AI Review stages once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-ai-review-stages-once.yml'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ORG_GITHUB_TOKEN }}
      API_VERSION: '2026-03-10'
    steps:
      - name: Set current AI Review stages
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo '::error::ORG_GITHUB_TOKEN is unavailable.'
            exit 1
          fi

          stage_field_id="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H "X-GitHub-Api-Version: ${API_VERSION}" \
            /orgs/uichat-mira/issue-fields \
            --jq '.[] | select(.name == "Stage") | .id' | head -n 1)"

          if [ -z "${stage_field_id:-}" ]; then
            echo '::error::Organization Stage Issue Field not found.'
            exit 1
          fi

          set_stage() {
            local repo="$1"
            local issue="$2"
            local stage="$3"
            local payload

            payload="$(jq -nc \
              --argjson field_id "$stage_field_id" \
              --arg value "$stage" \
              '{issue_field_values:[{field_id:$field_id,value:$value}]}')"

            gh api \
              --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H "X-GitHub-Api-Version: ${API_VERSION}" \
              "/repos/uichat-mira/${repo}/issues/${issue}/issue-field-values" \
              --input - <<<"$payload" >/dev/null

            echo "uichat-mira/${repo}#${issue} -> ${stage}"
          }

          set_stage '.github' 4 'In Progress'
          set_stage 'control-room' 1 'In Progress'
          set_stage 'mira-mobile' 109 'Ready'
