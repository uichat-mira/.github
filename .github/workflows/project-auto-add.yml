name: Mira Development project intake

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/project-auto-add.yml'

permissions:
  contents: read

concurrency:
  group: mira-development-project-intake
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ORG_GITHUB_TOKEN }}
      ORG: uichat-mira
      PROJECT_NUMBER: '1'
      API_VERSION: '2026-03-10'
    steps:
      - name: Validate project credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo '::error::ORG_GITHUB_TOKEN is not available to uichat-mira/.github.'
            exit 1
          fi

          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H "X-GitHub-Api-Version: ${API_VERSION}" \
            "/orgs/${ORG}/projectsV2/${PROJECT_NUMBER}" >/dev/null

      - name: Add open Organization Issues to Mira Development
        shell: bash
        run: |
          set -euo pipefail

          issues_file="$(mktemp)"
          project_file="$(mktemp)"

          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            -H "X-GitHub-Api-Version: ${API_VERSION}" \
            "/search/issues?q=org%3A${ORG}+is%3Aissue+is%3Aopen&per_page=100" \
            --jq '.items[] | [.id, .html_url] | @tsv' \
            | sort -u > "$issues_file"

          gh project item-list "$PROJECT_NUMBER" \
            --owner "$ORG" \
            --limit 1000 \
            --format json \
            --jq '.items[].content.url // empty' \
            | sort -u > "$project_file"

          added=0
          existing=0
          failed=0

          while IFS=$'\t' read -r issue_id issue_url; do
            [ -n "${issue_id:-}" ] || continue
            [ -n "${issue_url:-}" ] || continue

            if grep -Fxq "$issue_url" "$project_file"; then
              existing=$((existing + 1))
              continue
            fi

            echo "Adding $issue_url to Mira Development"

            if gh api \
              --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H "X-GitHub-Api-Version: ${API_VERSION}" \
              "/orgs/${ORG}/projectsV2/${PROJECT_NUMBER}/items" \
              -f type='Issue' \
              -F id="$issue_id" >/dev/null; then
              added=$((added + 1))
            else
              echo "::error::Failed to add $issue_url to Mira Development"
              failed=$((failed + 1))
            fi
          done < "$issues_file"

          echo "Project intake summary: added=$added existing=$existing failed=$failed"

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Default open Issues without Stage to Backlog
        shell: bash
        run: |
          set -euo pipefail

          project_node_id="$(gh project view "$PROJECT_NUMBER" --owner "$ORG" --format json --jq '.id')"
          fields_json="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H "X-GitHub-Api-Version: ${API_VERSION}" \
            "/orgs/${ORG}/projectsV2/${PROJECT_NUMBER}/fields?per_page=100")"

          stage_field_node_id="$(jq -r '.[] | select(.name == "Stage") | .node_id' <<<"$fields_json" | head -n 1)"
          backlog_option_id="$(jq -r '.[] | select(.name == "Stage") | .options[]? | select(.name.raw == "Backlog") | .id' <<<"$fields_json" | head -n 1)"

          if [ -z "${project_node_id:-}" ] || [ "$project_node_id" = "null" ]; then
            echo '::error::Could not resolve Mira Development project node ID.'
            exit 1
          fi

          if [ -z "${stage_field_node_id:-}" ] || [ "$stage_field_node_id" = "null" ] || \
             [ -z "${backlog_option_id:-}" ] || [ "$backlog_option_id" = "null" ]; then
            echo '::error::Could not resolve Stage field and Backlog option from Mira Development.'
            echo 'Available project fields:'
            jq -r '.[] | [.name, .data_type, ([.options[]?.name.raw] | join(","))] | @tsv' <<<"$fields_json"
            exit 1
          fi

          untriaged_file="$(mktemp)"

          gh project item-list "$PROJECT_NUMBER" \
            --owner "$ORG" \
            --limit 1000 \
            --query 'is:issue is:open no:stage' \
            --format json \
            --jq '.items[] | [.id, .content.url] | @tsv' \
            | sort -u > "$untriaged_file"

          updated=0
          failed=0

          while IFS=$'\t' read -r item_node_id issue_url; do
            [ -n "${item_node_id:-}" ] || continue
            [ -n "${issue_url:-}" ] || continue

            echo "Defaulting $issue_url to Stage=Backlog"
            if gh project item-edit \
              --id "$item_node_id" \
              --project-id "$project_node_id" \
              --field-id "$stage_field_node_id" \
              --single-select-option-id "$backlog_option_id" >/dev/null; then
              updated=$((updated + 1))
            else
              echo "::error::Failed to set Stage=Backlog for $issue_url"
              failed=$((failed + 1))
            fi
          done < "$untriaged_file"

          echo "Stage default summary: updated=$updated failed=$failed"

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
