name: Mira Development project intake

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/project-auto-add.yml'

permissions:
  contents: read

concurrency:
  group: mira-development-project-intake
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ORG_GITHUB_TOKEN }}
      ORG: uichat-mira
      PROJECT_NUMBER: '1'
      API_VERSION: '2026-03-10'
    steps:
      - name: Validate project credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo '::error::ORG_GITHUB_TOKEN is not available to uichat-mira/.github.'
            exit 1
          fi

          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H "X-GitHub-Api-Version: ${API_VERSION}" \
            "/orgs/${ORG}/projectsV2/${PROJECT_NUMBER}" >/dev/null

      - name: Add open Organization Issues to Mira Development
        shell: bash
        run: |
          set -euo pipefail

          issues_file="$(mktemp)"
          project_file="$(mktemp)"

          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            -H "X-GitHub-Api-Version: ${API_VERSION}" \
            "/search/issues?q=org%3A${ORG}+is%3Aissue+is%3Aopen&per_page=100" \
            --jq '.items[] | [.id, .html_url] | @tsv' \
            | sort -u > "$issues_file"

          gh project item-list "$PROJECT_NUMBER" \
            --owner "$ORG" \
            --limit 1000 \
            --format json \
            --jq '.items[].content.url // empty' \
            | sort -u > "$project_file"

          added=0
          existing=0
          failed=0

          while IFS=$'\t' read -r issue_id issue_url; do
            [ -n "${issue_id:-}" ] || continue
            [ -n "${issue_url:-}" ] || continue

            if grep -Fxq "$issue_url" "$project_file"; then
              existing=$((existing + 1))
              continue
            fi

            echo "Adding $issue_url to Mira Development"

            if gh api \
              --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H "X-GitHub-Api-Version: ${API_VERSION}" \
              "/orgs/${ORG}/projectsV2/${PROJECT_NUMBER}/items" \
              -f type='Issue' \
              -F id="$issue_id" >/dev/null; then
              added=$((added + 1))
            else
              echo "::error::Failed to add $issue_url to Mira Development"
              failed=$((failed + 1))
            fi
          done < "$issues_file"

          echo "Project intake summary: added=$added existing=$existing failed=$failed"

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Default open Issues without Stage to Backlog
        shell: bash
        run: |
          set -euo pipefail

          # Stage is an organization Issue Field surfaced as a Project column.
          # Issue-backed field values must be written through the Issue Fields API,
          # not the Project item field mutation used for project-only custom fields.
          issue_fields_json="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H "X-GitHub-Api-Version: ${API_VERSION}" \
            "/orgs/${ORG}/issue-fields")"

          stage_field_id="$(jq -r '.[] | select(.name == "Stage") | .id' <<<"$issue_fields_json" | head -n 1)"

          if [ -z "${stage_field_id:-}" ] || [ "$stage_field_id" = "null" ]; then
            echo '::error::Could not resolve organization Issue Field named Stage.'
            jq -r '.[] | [.id, .name, .data_type] | @tsv' <<<"$issue_fields_json"
            exit 1
          fi

          untriaged_file="$(mktemp)"

          gh project item-list "$PROJECT_NUMBER" \
            --owner "$ORG" \
            --limit 1000 \
            --query 'is:issue is:open no:stage' \
            --format json \
            --jq '.items[].content.url // empty' \
            | sort -u > "$untriaged_file"

          updated=0
          failed=0

          while IFS= read -r issue_url; do
            [ -n "${issue_url:-}" ] || continue

            issue_path="${issue_url#https://github.com/}"
            issue_owner="${issue_path%%/*}"
            remainder="${issue_path#*/}"
            issue_repo="${remainder%%/*}"
            issue_number="${issue_url##*/}"

            if [ "$issue_owner" != "$ORG" ] || ! [[ "$issue_number" =~ ^[0-9]+$ ]]; then
              echo "::error::Unexpected Issue URL from project: $issue_url"
              failed=$((failed + 1))
              continue
            fi

            echo "Defaulting $issue_url to Stage=Backlog"

            payload="$(jq -nc \
              --argjson field_id "$stage_field_id" \
              '{issue_field_values:[{field_id:$field_id,value:"Backlog"}]}')"

            if gh api \
              --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H "X-GitHub-Api-Version: ${API_VERSION}" \
              "/repos/${issue_owner}/${issue_repo}/issues/${issue_number}/issue-field-values" \
              --input - <<<"$payload" >/dev/null; then
              updated=$((updated + 1))
            else
              echo "::error::Failed to set Stage=Backlog for $issue_url"
              failed=$((failed + 1))
            fi
          done < "$untriaged_file"

          echo "Stage default summary: updated=$updated failed=$failed"

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
