name: Mira Free DeepSeek (Isolated Probe)

# Explicitly separate from the production Mira External Worker.
# This read-only experiment cannot dispatch Issues, write code, create PRs, or use paid fallback.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  free-deepseek-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify free model is currently listed
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 https://opencode.ai/inference/v1/models |
            jq -e '.data | any(.id == "deepseek-v4.1-flash-free")' >/dev/null

      - name: Install pinned official OpenCode v2 CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --version 2.0.24
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Verify official CLI version
        shell: bash
        run: |
          set -euo pipefail
          reported_version="$(opencode --version)"
          echo "Installed OpenCode CLI: ${reported_version}"
          test "$reported_version" = "opencode v2.0.24"

      - name: Test native OpenCode free-model route
        shell: bash
        env:
          OPENCODE_DISABLE_AUTOUPDATE: "1"
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          mkdir -p "$workdir/config" "$workdir/data"
          export XDG_CONFIG_HOME="$workdir/config"
          export XDG_DATA_HOME="$workdir/data"
          export XDG_CACHE_HOME="$workdir/cache"
          # No API keys and no custom provider: use the official opencode built-in route.
          # Do not invent User-Agent, session headers, or an upstream proxy.
          unset OPENCODE_AUTH_CONTENT
          export OPENCODE_CONFIG_CONTENT='{"share":"disabled","permission":{"*":"ask","bash":"deny","edit":"deny","write":"deny","webfetch":"deny","websearch":"deny","external_directory":"deny"}}'
          cd "$workdir"
          set +e
          timeout 180s opencode run \
            --model opencode/deepseek-v4.1-flash-free \
            --agent build \
            --format json \
            "Connectivity check only. Do not access files or call tools. Reply exactly MIRA_FREE_DS_PROBE_OK." \
            > "$RUNNER_TEMP/free-ds-output.jsonl" 2> "$RUNNER_TEMP/free-ds-stderr.log"
          code="$?"
          set -e
          python3 - "$code" <<'PY'
          import json
          import sys
          from pathlib import Path
          import os

          exit_code = int(sys.argv[1])
          root = Path(os.environ["RUNNER_TEMP"])
          events = []
          texts = []
          errors = []
          for line in (root / "free-ds-output.jsonl").read_text(errors="replace").splitlines():
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if not isinstance(event, dict):
                  continue
              events.append(event.get("type"))
              if event.get("type") == "error":
                  errors.append(str(event.get("error", "provider error"))[:500])
              if event.get("type") == "text":
                  part = event.get("part", {})
                  if isinstance(part, dict) and isinstance(part.get("text"), str):
                      texts.append(part["text"].strip())
          ok = exit_code == 0 and not errors and "MIRA_FREE_DS_PROBE_OK" in texts
          summary = {
              "model": "opencode/deepseek-v4.1-flash-free",
              "client": "official-opencode-cli/2.0.24",
              "provider_route": "built-in; no custom provider or proxy",
              "authenticated": False,
              "exit_code": exit_code,
              "event_types": sorted({str(x) for x in events}),
              "error_count": len(errors),
              "expected_text_seen": "MIRA_FREE_DS_PROBE_OK" in texts,
              "passed": ok,
          }
          (root / "free-ds-summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          if not ok:
              for err in errors[:2]:
                  print("Provider error:", err, file=sys.stderr)
              print(
                  "CLI stderr tail:",
                  (root / "free-ds-stderr.log").read_text(errors="replace")[-1600:],
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

      - name: Upload bounded experiment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: free-deepseek-probe
          path: |
            ${{ runner.temp }}/free-ds-summary.json
            ${{ runner.temp }}/free-ds-output.jsonl
            ${{ runner.temp }}/free-ds-stderr.log
          if-no-files-found: ignore
          retention-days: 7

  free-deepseek-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install pinned official OpenCode v2 CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --version 2.0.24
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Verify official CLI version
        shell: bash
        run: |
          set -euo pipefail
          reported_version="$(opencode --version)"
          echo "Installed OpenCode CLI: ${reported_version}"
          test "$reported_version" = "opencode v2.0.24"

      - name: Verify native file Tool Calling in disposable scratch workspace
        shell: bash
        env:
          OPENCODE_DISABLE_AUTOUPDATE: "1"
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          mkdir -p "$workdir/config" "$workdir/data"
          printf 'base=100\nspent=40\n' > "$workdir/input.txt"
          export XDG_CONFIG_HOME="$workdir/config"
          export XDG_DATA_HOME="$workdir/data"
          export XDG_CACHE_HOME="$workdir/cache"
          unset OPENCODE_AUTH_CONTENT
          # CLI V2 requires ordered permissions, not the V1 "permission" object.
          export OPENCODE_CONFIG_CONTENT='{"share":"disabled","permissions":[{"action":"read","resource":"*","effect":"allow"},{"action":"glob","resource":"*","effect":"allow"},{"action":"grep","resource":"*","effect":"allow"},{"action":"edit","resource":"*","effect":"allow"},{"action":"shell","resource":"*","effect":"deny"},{"action":"webfetch","resource":"*","effect":"deny"},{"action":"websearch","resource":"*","effect":"deny"},{"action":"external_directory","resource":"*","effect":"deny"},{"action":"subagent","resource":"*","effect":"deny"}]}'
          cd "$workdir"
          set +e
          timeout 180s opencode run \
            --model opencode/deepseek-v4.1-flash-free \
            --agent build \
            --format json \
            "Using native file tools (not shell), read input.txt, subtract spent from base, and create result.txt containing exactly: remaining=60. Do not create other files." \
            > "$RUNNER_TEMP/free-ds-tool-events.jsonl" 2> "$RUNNER_TEMP/free-ds-tool-stderr.log"
          code="$?"
          set -e
          python3 - "$workdir" "$code" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          workdir = Path(sys.argv[1])
          exit_code = int(sys.argv[2])
          events_file = Path(os.environ["RUNNER_TEMP"]) / "free-ds-tool-events.jsonl"
          events = []
          errors = []
          for line in events_file.read_text(errors="replace").splitlines():
              try:
                  item = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if isinstance(item, dict):
                  events.append(item.get("type"))
                  if item.get("type") == "error":
                      errors.append(str(item.get("error", ""))[:300])
          actual = (workdir / "result.txt").read_text().strip() if (workdir / "result.txt").is_file() else None
          passed = exit_code == 0 and not errors and actual == "remaining=60"
          summary = {
              "model": "opencode/deepseek-v4.1-flash-free",
              "smoke": "native file read and write without shell",
              "exit_code": exit_code,
              "actual_result": actual[:100] if actual else None,
              "event_types": sorted({str(item) for item in events}),
              "error_count": len(errors),
              "passed": passed,
          }
          (Path(os.environ["RUNNER_TEMP"]) / "free-ds-tool-summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          if not passed:
              print("Tool smoke failed:", errors[:2], file=sys.stderr)
              print((Path(os.environ["RUNNER_TEMP"]) / "free-ds-tool-stderr.log").read_text(errors="replace")[-1200:], file=sys.stderr)
              sys.exit(1)
          PY

      - name: Upload isolated file-tool evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: free-deepseek-tool-smoke
          path: |
            ${{ runner.temp }}/free-ds-tool-summary.json
            ${{ runner.temp }}/free-ds-tool-events.jsonl
            ${{ runner.temp }}/free-ds-tool-stderr.log
          if-no-files-found: ignore
          retention-days: 7

  free-native-skill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install pinned OpenCode v2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --version 2.0.24
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Install pinned execute-work-item Skill to V2 native directory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          skill_root="$HOME/.config/opencode/skills/execute-work-item"
          mkdir -p "$skill_root"
          gh api "repos/uichat-mira/.github/contents/skills/execute-work-item/SKILL.md?ref=d8ba9f80b5736fa10e4ac10041b501ff5d39e5d9" --jq '.content' |
            tr -d '\n' | base64 --decode > "$skill_root/SKILL.md"
          test -s "$skill_root/SKILL.md"
          grep -q '^name: execute-work-item$' "$skill_root/SKILL.md"

      - name: Verify native skill tool loads the pinned organization Skill
        shell: bash
        env:
          OPENCODE_DISABLE_AUTOUPDATE: "1"
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          mkdir -p "$workdir/data"
          # Keep the actual HOME-native Skill source visible to OpenCode.
          export XDG_DATA_HOME="$workdir/data"
          export XDG_CACHE_HOME="$workdir/cache"
          unset OPENCODE_AUTH_CONTENT
          export OPENCODE_CONFIG_CONTENT='{"share":"disabled","permissions":[{"action":"skill","resource":"execute-work-item","effect":"allow"},{"action":"read","resource":"*","effect":"deny"},{"action":"edit","resource":"*","effect":"deny"},{"action":"shell","resource":"*","effect":"deny"},{"action":"webfetch","resource":"*","effect":"deny"},{"action":"websearch","resource":"*","effect":"deny"},{"action":"subagent","resource":"*","effect":"deny"}]}'
          cd "$workdir"
          set +e
          timeout 180s opencode run \
            --model opencode/deepseek-v4.1-flash-free \
            --agent build \
            --format json \
            "Test only: invoke the native skill tool with ID execute-work-item to load that skill. Do not implement any issue or touch files. Then reply MIRA_SKILL_LOAD_OK." \
            > "$RUNNER_TEMP/free-skill-events.jsonl" 2> "$RUNNER_TEMP/free-skill-stderr.log"
          code="$?"
          set -e
          python3 - "$code" <<'PY'
          import json, os, sys
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          tools = []
          texts = []
          errors = []
          for line in (root / "free-skill-events.jsonl").read_text(errors="replace").splitlines():
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if not isinstance(event, dict):
                  continue
              typ = event.get("type")
              part = event.get("part") or {}
              if typ == "tool_use" and isinstance(part, dict):
                  tools.append({"tool": part.get("tool"), "status": (part.get("state") or {}).get("status")})
              if typ == "text" and isinstance(part, dict):
                  texts.append(part.get("text") or "")
              if typ == "error":
                  errors.append(str(event.get("error"))[:300])
          loaded = any(t["tool"] == "skill" and t["status"] == "completed" for t in tools)
          passed = int(sys.argv[1]) == 0 and loaded and not errors and any("MIRA_SKILL_LOAD_OK" in t for t in texts)
          summary = {"skill": "execute-work-item", "native_tool_loaded": loaded, "tool_calls": tools[:15], "provider_errors": len(errors), "passed": passed}
          (root / "free-skill-summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          if not passed:
              print("CLI stderr tail:", (root / "free-skill-stderr.log").read_text(errors="replace")[-1200:], file=sys.stderr)
              sys.exit(1)
          PY

      - name: Upload bounded Skill proof
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: free-native-skill-smoke
          path: |
            ${{ runner.temp }}/free-skill-summary.json
            ${{ runner.temp }}/free-skill-events.jsonl
            ${{ runner.temp }}/free-skill-stderr.log
          if-no-files-found: ignore
          retention-days: 7
