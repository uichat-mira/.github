name: Dispatch Worker 39

on:
  push:
    branches:
      - dispatch/39-worker
    paths:
      - .github/workflows/dispatch-39-worker.yml

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  worker:
    uses: uichat-mira/.github/.github/workflows/mira-external-worker.yml@b5cff98a7fdf0c78cbc1323a1d7662849c9bf285
    with:
      issue_number: 39
      base_branch: main
      verification_command: |
        docker run --rm \
          -v "$PWD:/repo" \
          --workdir /repo \
          rhysd/actionlint:1.7.7 \
          -color \
          .github/workflows/mira-external-worker.yml
    secrets:
      opencode_go_api_key: ${{ secrets.AI_PROVIDER_OPENCODE_GO_KEY }}
