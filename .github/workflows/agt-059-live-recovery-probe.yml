name: AGT-059 Live Recovery Probe

on:
  push:
    branches:
      - feat/agt-059-candidate-recovery
    paths:
      - .github/workflows/agt-059-live-recovery-probe.yml

permissions: {}

jobs:
  phase-b-discover-restore-continue:
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: none
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout AGT-059 implementation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Discover live Recovery pointer
        id: discover
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: 73
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/agt-059-live-probe"
          mkdir -p "$root"

          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" > "$root/comment-pages.json"
          jq '[.[][]]' "$root/comment-pages.json" > "$root/comments.json"

          python3 .github/scripts/worker-candidate/recovery.py discover-pointer \
            --comments-json "$root/comments.json" \
            --repository "$GITHUB_REPOSITORY" \
            --issue-number "$ISSUE_NUMBER" \
            --output "$root/discovery.json"

          test "$(jq -r '.found' "$root/discovery.json")" = true
          test "$(jq -r '.invalid_latest_pointer // false' "$root/discovery.json")" = false
          jq '.pointer' "$root/discovery.json" > "$root/pointer.json"
          test "$(jq -r '.provider' "$root/pointer.json")" = agt-059-live-probe

          source_run_id="$(jq -r '.run_id' "$root/pointer.json")"
          test "$source_run_id" != "$GITHUB_RUN_ID"
          {
            echo "source_run_id=$source_run_id"
            echo "candidate_artifact_name=$(jq -r '.candidate_artifact_name' "$root/pointer.json")"
            echo "pointer_comment_id=$(jq -r '._comment_id' "$root/pointer.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Download prior-run Candidate and prove Artifact identity
        id: download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.discover.outputs.source_run_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ steps.discover.outputs.candidate_artifact_name }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/agt-059-live-probe"
          pointer="$root/pointer.json"
          candidate="$root/candidate"
          mkdir -p "$candidate"

          normalize_artifact_digest() {
            local digest="${1:-}"
            if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              printf '%s' "$digest"
            elif [[ "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              printf 'sha256:%s' "$digest"
            else
              echo "invalid digest: $digest" >&2
              return 2
            fi
          }

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" > "$root/artifacts.json"
          match="$(jq -c --arg name "$CANDIDATE_ARTIFACT_NAME" '[.artifacts[] | select(.name == $name)]' "$root/artifacts.json")"
          test "$(jq 'length' <<< "$match")" -eq 1

          expected_id="$(jq -r '.candidate_artifact_id' "$pointer")"
          expected_digest="$(normalize_artifact_digest "$(jq -r '.candidate_artifact_digest' "$pointer")")"
          actual_id="$(jq -r '.[0].id' <<< "$match")"
          actual_digest="$(normalize_artifact_digest "$(jq -r '.[0].digest' <<< "$match")")"
          actual_expired="$(jq -r '.[0].expired' <<< "$match")"

          test "$actual_id" = "$expected_id"
          test "$actual_digest" = "$expected_digest"
          test "$actual_expired" = false

          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$CANDIDATE_ARTIFACT_NAME" --dir "$candidate"

          test -s "$candidate/candidate.json"
          test -s "$candidate/candidate.patch"
          echo "::notice::Cross-run Candidate Artifact identity validated: $actual_id $actual_digest"

      - name: Recompute current Issue contract and decide Recovery
        id: decision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: 73
          VERIFICATION_COMMAND: test -f agt-059-live-probe.txt
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/agt-059-live-probe"

          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > "$root/issue.json"
          : > "$root/trusted-logins.txt"

          while IFS= read -r login; do
            test -n "$login" || continue
            user_type="$(jq -r --arg login "$login" '[.[] | select(.user.login == $login) | .user.type][0] // ""' "$root/comments.json")"
            test "$user_type" != "Bot" || continue
            if permission_json="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${login}/permission" 2>/dev/null)"; then
              permission="$(jq -r '.permission // ""' <<< "$permission_json")"
            else
              continue
            fi
            case "$permission" in
              admin|maintain|write) printf '%s\n' "$login" >> "$root/trusted-logins.txt" ;;
            esac
          done < <(jq -r '.[].user.login' "$root/comments.json" | sort -u)

          jq --rawfile trusted "$root/trusted-logins.txt" '
            ($trusted | split("\n") | map(select(length > 0))) as $trusted_logins
            | [
                .[]
                | select(.user.type != "Bot")
                | select(.user.login as $login | ($trusted_logins | index($login)) != null)
                | {
                    id,
                    author: .user.login,
                    created_at,
                    updated_at,
                    body: (.body // "")
                  }
              ]
            | sort_by(.created_at, .id)
          ' "$root/comments.json" > "$root/trusted-comments.json"

          python3 .github/scripts/worker-candidate/recovery.py fingerprint \
            --issue-json "$root/issue.json" \
            --comments-json "$root/trusted-comments.json" \
            --base-branch main \
            --verification-command "$VERIFICATION_COMMAND" \
            --output "$root/current-contract.json"

          test "$(jq -r '.fingerprint' "$root/current-contract.json")" = "$(jq -r '.contract_fingerprint' "$root/pointer.json")"
          test "$(jq -r '.ambiguity_guard' "$root/current-contract.json")" = "$(jq -r '.ambiguity_guard' "$root/pointer.json")"

          python3 .github/scripts/worker-candidate/recovery.py decide \
            --current-contract "$root/current-contract.json" \
            --pointer "$root/pointer.json" \
            --candidate-manifest "$root/candidate/candidate.json" \
            --repository "$GITHUB_REPOSITORY" \
            --issue-number "$ISSUE_NUMBER" \
            --output "$root/recovery-state.json"

          test "$(jq -r '.mode' "$root/recovery-state.json")" = recoverable
          test "$(jq -r '.run_worker' "$root/recovery-state.json")" = true
          test "$(jq -r '.reuse_candidate' "$root/recovery-state.json")" = true
          echo "mode=$(jq -r '.mode' "$root/recovery-state.json")" >> "$GITHUB_OUTPUT"

      - name: Restore exact Candidate in clean worktree and continue
        shell: bash
        env:
          ISSUE_NUMBER: 73
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/agt-059-live-probe"
          pointer="$root/pointer.json"
          candidate="$root/candidate"
          restore="$root/restore"

          base_sha="$(jq -r '.base_sha' "$pointer")"
          fingerprint="$(jq -r '.contract_fingerprint' "$pointer")"
          expected_patch="$(jq -r '.candidate_patch_sha256' "$pointer")"
          expected_tree="$(jq -r '.candidate_tree_oid' "$pointer")"

          git fetch --no-tags origin "$base_sha"
          git worktree add --detach "$restore" "$base_sha"

          python3 "$GITHUB_WORKSPACE/.github/scripts/worker-candidate/candidate.py" restore \
            --repo "$restore" \
            --candidate-dir "$candidate" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-issue-number "$ISSUE_NUMBER" \
            --expected-base-sha "$base_sha" \
            --expected-contract-fingerprint "$fingerprint" \
            > "$root/restore-result.json"

          test "$(jq -r '.candidate_patch_sha256' "$root/restore-result.json")" = "$expected_patch"
          test "$(jq -r '.candidate_tree_oid' "$root/restore-result.json")" = "$expected_tree"
          test "$(git -C "$restore" write-tree)" = "$expected_tree"
          test "$(cat "$restore/agt-059-live-probe.txt")" = "AGT-059 live recovery probe"

          printf 'continued by independent Run B\n' >> "$restore/agt-059-live-probe.txt"
          git -C "$restore" diff --check
          grep -q 'continued by independent Run B' "$restore/agt-059-live-probe.txt"

          echo "::notice::Run B restored Candidate from Run ${{ steps.discover.outputs.source_run_id }} and continued from that workspace."
          git worktree remove --force "$restore"

      - name: Remove temporary AGT-059 probe pointers
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: 73
        run: |
          set -euo pipefail
          comments="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" | jq '[.[][]]')"
          mapfile -t ids < <(jq -r '
            .[]
            | select(.user.login == "github-actions[bot]" and .user.type == "Bot")
            | select((.body // "") | contains("agt-059-live-probe"))
            | .id
          ' <<< "$comments")

          for id in "${ids[@]}"; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${id}"
            echo "::notice::Removed temporary Recovery probe comment $id."
          done
