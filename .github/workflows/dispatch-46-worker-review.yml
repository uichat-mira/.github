name: Dispatch Worker PR 46 Review

on:
  push:
    branches:
      - dispatch/46-worker-review
    paths:
      - .github/workflows/dispatch-46-worker-review.yml

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  worker:
    uses: uichat-mira/.github/.github/workflows/mira-external-worker.yml@f7dca3c7323cbfd9816ed3abd33d53a71ec1bc8c
    with:
      issue_number: 40
      base_branch: trusted/40-provider-model
      verification_command: |
        git diff --check
        ruby -e 'require "yaml"; YAML.load_file(".github/workflows/mira-external-worker.yml")'
    secrets:
      opencode_go_api_key: ${{ secrets.AI_PROVIDER_OPENCODE_GO_KEY }}
