name: Mira External Worker

on:
  workflow_call:
    inputs:
      issue_number:
        description: Open GitHub Issue number that owns the work
        required: true
        type: number
      base_branch:
        description: Explicit delivery base branch
        required: true
        type: string
      verification_command:
        description: Trusted repository-owned verification command
        required: true
        type: string
      timeout_minutes:
        description: Advisory Worker planning budget (minutes); never used as a hard termination timeout
        required: false
        type: number
        default: 60
      free_mode:
        description: Run keyless official OpenCode CLI v2 on allowlisted free models
        required: false
        type: boolean
        default: false
      provider:
        description: Run-scoped OpenCode provider identifier
        required: false
        type: string
        default: opencode-go
      model:
        description: Run-scoped model identifier
        required: false
        type: string
        default: deepseek-v4.1-flash
      provider_profile:
        description: Optional provider profile from the frozen Organization registry
        required: false
        type: string
        default: ''
      provider_registry_ref:
        description: Immutable 40-character .github commit SHA containing the provider registry
        required: false
        type: string
        default: ''
    secrets:
      opencode_go_api_key:
        description: Backward-compatible OpenCode Go API credential
        required: false
      provider_api_key:
        description: Run-scoped credential for the selected provider
        required: false
    outputs:
      worker_branch:
        description: Isolated worker branch name reserved from the explicit base
        value: ${{ jobs.worker_capture.outputs.worker_branch }}
      pull_request_url:
        description: Draft pull request URL from current Delivery or an already delivered Candidate
        value: ${{ jobs.delivery.outputs.pull_request_url || jobs.worker_capture.outputs.pull_request_url }}

permissions:
  contents: read
  issues: read
  pull-requests: none

jobs:
  worker_capture:
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: none
    runs-on: ubuntu-latest
    outputs:
      worker_branch: ${{ steps.handoff.outputs.worker_branch }}
      pull_request_url: ${{ steps.handoff.outputs.pull_request_url }}
      base_sha: ${{ steps.identity.outputs.base_sha }}
      candidate_base_sha: ${{ steps.handoff.outputs.candidate_base_sha }}
      candidate_origin_run_id: ${{ steps.handoff.outputs.candidate_origin_run_id }}
      candidate_origin_run_attempt: ${{ steps.handoff.outputs.candidate_origin_run_attempt }}
      candidate_base_branch: ${{ steps.handoff.outputs.candidate_base_branch }}
      model: ${{ steps.handoff.outputs.model }}
      recovery_mode: ${{ steps.handoff.outputs.recovery_mode }}
      recovery_source_run_id: ${{ steps.handoff.outputs.recovery_source_run_id }}
      candidate_artifact_name: ${{ steps.handoff.outputs.candidate_artifact_name }}
      candidate_artifact_id: ${{ steps.handoff.outputs.candidate_artifact_id }}
      candidate_artifact_digest: ${{ steps.handoff.outputs.candidate_artifact_digest }}
      recovered_candidate_upload_outcome: ${{ steps.recovered_candidate_upload.outcome }}
      recovered_verify_upload_outcome: ${{ steps.recovered_verify_upload.outcome }}
      candidate_patch_sha256: ${{ steps.handoff.outputs.candidate_patch_sha256 }}
      candidate_tree_oid: ${{ steps.handoff.outputs.candidate_tree_oid }}
      contract_fingerprint: ${{ steps.handoff.outputs.contract_fingerprint }}
      ambiguity_guard: ${{ steps.handoff.outputs.ambiguity_guard }}
      verification_artifact_name: ${{ steps.handoff.outputs.verification_artifact_name }}
      verified_patch_sha256: ${{ steps.handoff.outputs.verified_patch_sha256 }}
      verified_tree_oid: ${{ steps.handoff.outputs.verified_tree_oid }}
      verified_contract_fingerprint: ${{ steps.handoff.outputs.verified_contract_fingerprint }}
      provider: ${{ steps.handoff.outputs.provider }}
      provider_profile: ${{ steps.handoff.outputs.provider_profile }}
      provider_registry_ref: ${{ steps.handoff.outputs.provider_registry_ref }}
      model_route: ${{ steps.handoff.outputs.model_route }}

    steps:
      - name: Validate Mira caller and work item
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail

          test "${GITHUB_REPOSITORY_OWNER}" = "uichat-mira"

          issue_json="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")"
          test "$(jq -r '.state' <<< "$issue_json")" = "open"

          if jq -e '.pull_request != null' <<< "$issue_json" >/dev/null; then
            echo "Issue #${ISSUE_NUMBER} resolves to a pull request, not a work-item Issue." >&2
            exit 1
          fi

          mkdir -p "${RUNNER_TEMP}/mira-worker"
          printf '%s\n' "$issue_json" > "${RUNNER_TEMP}/mira-worker/issue.json"

          comments_pages="${RUNNER_TEMP}/mira-worker/issue-comments-pages.json"
          comments_json="${RUNNER_TEMP}/mira-worker/issue-comments.json"
          trusted_comments="${RUNNER_TEMP}/mira-worker/maintainer-comments.json"
          trusted_logins="${RUNNER_TEMP}/mira-worker/trusted-commenters.txt"

          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" > "$comments_pages"
          jq '[.[][]]' "$comments_pages" > "$comments_json"
          : > "$trusted_logins"

          while IFS= read -r login; do
            test -n "$login" || continue

            user_type="$(jq -r --arg login "$login" '[.[] | select(.user.login == $login) | .user.type][0] // ""' "$comments_json")"
            test "$user_type" != "Bot" || continue

            if permission_json="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${login}/permission" 2>/dev/null)"; then
              permission="$(jq -r '.permission // ""' <<< "$permission_json")"
            else
              echo "::warning::Ignoring Issue comments from @${login}: repository permission could not be verified."
              continue
            fi

            case "$permission" in
              admin|maintain|write)
                printf '%s\n' "$login" >> "$trusted_logins"
                ;;
            esac
          done < <(jq -r '.[].user.login' "$comments_json" | sort -u)

          jq --rawfile trusted "$trusted_logins" '
            ($trusted | split("\n") | map(select(length > 0))) as $trusted_logins
            | [
                .[]
                | select(.user.type != "Bot")
                | select(.user.login as $login | ($trusted_logins | index($login)) != null)
                | {
                    id,
                    author: .user.login,
                    created_at,
                    updated_at,
                    body: (.body // "")
                  }
              ]
            | sort_by(.created_at, .id)
          ' "$comments_json" > "$trusted_comments"

      - name: Checkout explicit delivery base
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Establish immutable execution identity
        id: identity
        shell: bash
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          set -euo pipefail

          git check-ref-format "refs/heads/${BASE_BRANCH}"

          base_sha="$(git rev-parse HEAD)"
          worker_branch="feat/worker-${ISSUE_NUMBER}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git check-ref-format --branch "$worker_branch"

          git switch -c "$worker_branch"

          maintainer_comment_count="$(jq 'length' "${RUNNER_TEMP}/mira-worker/maintainer-comments.json")"

          run_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          cat > "${RUNNER_TEMP}/mira-worker/identity.txt" <<EOF
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          run_started_at=${run_started_at}
          repository=${GITHUB_REPOSITORY}
          issue=${ISSUE_NUMBER}
          base_branch=${BASE_BRANCH}
          base_sha=${base_sha}
          worker_branch=${worker_branch}
          opencode_version=${{ inputs.free_mode && '2.0.24' || '1.18.34' }}
          skill_commit=d8ba9f80b5736fa10e4ac10041b501ff5d39e5d9
          trusted_maintainer_comments=${maintainer_comment_count}
          EOF

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "worker_branch=$worker_branch" >> "$GITHUB_OUTPUT"

      - name: Discover and prepare Candidate Recovery
        id: recovery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          CURRENT_BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          VERIFICATION_COMMAND: ${{ inputs.verification_command }}
        run: |
          set -euo pipefail

          root="${RUNNER_TEMP}/mira-worker"
          recovery_root="${root}/recovery"
          mkdir -p "$recovery_root"

          /usr/bin/curl -fsSL --retry 2 --proto '=https' --tlsv1.2 \
            "https://raw.githubusercontent.com/uichat-mira/.github/1177ab66f46f2d66c212118c56b46cdceb135590/.github/scripts/worker-candidate/recovery.py" \
            -o "${root}/trusted-recovery.py"
          /usr/bin/curl -fsSL --retry 2 --proto '=https' --tlsv1.2 \
            "https://raw.githubusercontent.com/uichat-mira/.github/c5d93e149765f9068f3d342d2aed3a40a8f20efc/.github/scripts/worker-candidate/candidate.py" \
            -o "${root}/trusted-candidate.py"
          test -s "${root}/trusted-recovery.py"
          test -s "${root}/trusted-candidate.py"

          python3 "${root}/trusted-recovery.py" fingerprint \
            --issue-json "${root}/issue.json" \
            --comments-json "${root}/maintainer-comments.json" \
            --base-branch "$BASE_BRANCH" \
            --verification-command "$VERIFICATION_COMMAND" \
            --output "${root}/contract.json"

          current_fingerprint="$(jq -r '.fingerprint' "${root}/contract.json")"
          ambiguity_guard="$(jq -r '.ambiguity_guard' "${root}/contract.json")"
          {
            echo "contract_fingerprint=$current_fingerprint"
            echo "ambiguity_guard=$ambiguity_guard"
          } >> "$GITHUB_OUTPUT"

          python3 "${root}/trusted-recovery.py" discover-pointer \
            --comments-json "${root}/issue-comments.json" \
            --repository "$GITHUB_REPOSITORY" \
            --issue-number "$ISSUE_NUMBER" \
            --output "${recovery_root}/discovery.json"

          if test "$(jq -r '.invalid_latest_pointer // false' "${recovery_root}/discovery.json")" = "true"; then
            invalid_comment_id="$(jq -r '.invalid_pointer_comment_id' "${recovery_root}/discovery.json")"
            jq -n --arg comment "$invalid_comment_id" \
              '{schema_version:1,mode:"recovery_failed",run_worker:false,reuse_candidate:false,reason:"latest_recovery_pointer_invalid",source_comment_id:$comment}' \
              > "${root}/recovery-state.json"
            echo "mode=recovery_failed" >> "$GITHUB_OUTPUT"
            echo "run_worker=false" >> "$GITHUB_OUTPUT"
            echo "source_run_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if test "$(jq -r '.found' "${recovery_root}/discovery.json")" != "true"; then
            jq -n \
              --arg fingerprint "$current_fingerprint" \
              --arg guard "$ambiguity_guard" \
              '{schema_version:1,mode:"fresh",run_worker:true,reuse_candidate:false,reason:"no_prior_candidate",contract_fingerprint:$fingerprint,ambiguity_guard:$guard}' \
              > "${root}/recovery-state.json"
            printf '%s\n' "No prior Recovery Candidate exists for this Issue. Start from the explicit current base." > "${root}/recovery-context.txt"
            {
              echo "mode=fresh"
              echo "run_worker=true"
              echo "source_run_id="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          jq '.pointer' "${recovery_root}/discovery.json" > "${recovery_root}/pointer.json"
          source_run_id="$(jq -r '.run_id' "${recovery_root}/pointer.json")"
          candidate_artifact_name="$(jq -r '.candidate_artifact_name // ""' "${recovery_root}/pointer.json")"
          verify_artifact_name="$(jq -r '.verification_artifact_name // ""' "${recovery_root}/pointer.json")"
          delivery_artifact_name="$(jq -r '.delivery_artifact_name // ""' "${recovery_root}/pointer.json")"
          prior_base_sha="$(jq -r '.base_sha' "${recovery_root}/pointer.json")"

          {
            echo "source_run_id=$source_run_id"
            echo "source_candidate_artifact_name=$candidate_artifact_name"
            echo "source_verify_artifact_name=$verify_artifact_name"
          } >> "$GITHUB_OUTPUT"

          if test -z "$candidate_artifact_name"; then
            jq -n --arg run "$source_run_id" \
              '{schema_version:1,mode:"recovery_failed",run_worker:false,reuse_candidate:false,reason:"prior_pointer_missing_candidate_artifact",source_run_id:$run}' \
              > "${root}/recovery-state.json"
            echo "mode=recovery_failed" >> "$GITHUB_OUTPUT"
            echo "run_worker=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p "${recovery_root}/candidate" "${recovery_root}/verify" "${recovery_root}/delivery"
          set +e
          gh run download "$source_run_id" --repo "$GITHUB_REPOSITORY" \
            --name "$candidate_artifact_name" --dir "${recovery_root}/candidate" \
            >"${recovery_root}/candidate-download.stdout" 2>"${recovery_root}/candidate-download.stderr"
          candidate_download_rc="$?"
          set -e

          if test "$candidate_download_rc" -ne 0 || ! test -s "${recovery_root}/candidate/candidate.json" || ! test -s "${recovery_root}/candidate/candidate.patch"; then
            jq -n \
              --arg run "$source_run_id" \
              --arg artifact "$candidate_artifact_name" \
              '{schema_version:1,mode:"recovery_failed",run_worker:false,reuse_candidate:false,reason:"candidate_artifact_unavailable_or_expired_or_incomplete",source_run_id:$run,candidate_artifact_name:$artifact}' \
              > "${root}/recovery-state.json"
            printf 'Historical Candidate pointer exists for run %s, but Artifact %s is unavailable, expired, or incomplete.\n' "$source_run_id" "$candidate_artifact_name" > "${root}/recovery-context.txt"
            echo "mode=recovery_failed" >> "$GITHUB_OUTPUT"
            echo "run_worker=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pointer_artifact_id="$(jq -r '.candidate_artifact_id // ""' "${recovery_root}/pointer.json")"
          pointer_artifact_digest="$(jq -r '.candidate_artifact_digest // ""' "${recovery_root}/pointer.json")"
          set +e
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}/artifacts?per_page=100" \
            > "${recovery_root}/artifact-list.json" 2> "${recovery_root}/artifact-list.stderr"
          artifact_list_rc="$?"
          set -e
          if test "$artifact_list_rc" -ne 0; then
            jq -n --arg run "$source_run_id" \
              '{schema_version:1,mode:"recovery_failed",run_worker:false,reuse_candidate:false,reason:"candidate_artifact_metadata_unavailable",source_run_id:$run}' \
              > "${root}/recovery-state.json"
            echo "mode=recovery_failed" >> "$GITHUB_OUTPUT"
            echo "run_worker=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          artifact_matches="$(jq -c --arg name "$candidate_artifact_name" '[.artifacts[]? | select(.name == $name)]' "${recovery_root}/artifact-list.json")"
          if test "$(jq 'length' <<< "$artifact_matches")" -ne 1; then
            jq -n --arg run "$source_run_id" \
              '{schema_version:1,mode:"recovery_failed",run_worker:false,reuse_candidate:false,reason:"candidate_artifact_identity_ambiguous_or_missing",source_run_id:$run}' \
              > "${root}/recovery-state.json"
            echo "mode=recovery_failed" >> "$GITHUB_OUTPUT"
            echo "run_worker=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          actual_artifact_id="$(jq -r '.[0].id' <<< "$artifact_matches")"
          actual_artifact_digest="$(jq -r '.[0].digest // ""' <<< "$artifact_matches")"
          actual_artifact_expired="$(jq -r '.[0].expired' <<< "$artifact_matches")"
          if test "$actual_artifact_id" != "$pointer_artifact_id" || test "$actual_artifact_digest" != "$pointer_artifact_digest" || test "$actual_artifact_expired" != "false"; then
            jq -n --arg run "$source_run_id" \
              '{schema_version:1,mode:"recovery_failed",run_worker:false,reuse_candidate:false,reason:"candidate_artifact_identity_mismatch_or_expired",source_run_id:$run}' \
              > "${root}/recovery-state.json"
            echo "mode=recovery_failed" >> "$GITHUB_OUTPUT"
            echo "run_worker=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          prior_verify_state="$(jq -r '.verification_state // "skipped"' "${recovery_root}/pointer.json")"
          if test "$prior_verify_state" = "success" || test "$prior_verify_state" = "failure"; then
            if test -z "$verify_artifact_name"; then
              jq -n --arg run "$source_run_id" \
                '{schema_version:1,mode:"recovery_failed",run_worker:false,reuse_candidate:false,reason:"verification_artifact_pointer_missing",source_run_id:$run}' \
                > "${root}/recovery-state.json"
              echo "mode=recovery_failed" >> "$GITHUB_OUTPUT"
              echo "run_worker=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            set +e
            gh run download "$source_run_id" --repo "$GITHUB_REPOSITORY" \
              --name "$verify_artifact_name" --dir "${recovery_root}/verify" \
              >"${recovery_root}/verify-download.stdout" 2>"${recovery_root}/verify-download.stderr"
            verify_download_rc="$?"
            set -e
            if test "$verify_download_rc" -ne 0 || ! test -s "${recovery_root}/verify/verify-run.json"; then
              jq -n --arg run "$source_run_id" --arg artifact "$verify_artifact_name" \
                '{schema_version:1,mode:"recovery_failed",run_worker:false,reuse_candidate:false,reason:"verification_artifact_unavailable_expired_or_incomplete",source_run_id:$run,verification_artifact_name:$artifact}' \
                > "${root}/recovery-state.json"
              echo "mode=recovery_failed" >> "$GITHUB_OUTPUT"
              echo "run_worker=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif test "$prior_verify_state" = "skipped"; then
            if test -n "$verify_artifact_name"; then
              jq -n --arg run "$source_run_id" \
                '{schema_version:1,mode:"recovery_failed",run_worker:false,reuse_candidate:false,reason:"verification_pointer_state_mismatch",source_run_id:$run}' \
                > "${root}/recovery-state.json"
              echo "mode=recovery_failed" >> "$GITHUB_OUTPUT"
              echo "run_worker=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            jq -n --arg run "$source_run_id" \
              '{schema_version:1,mode:"recovery_failed",run_worker:false,reuse_candidate:false,reason:"verification_pointer_state_invalid",source_run_id:$run}' \
              > "${root}/recovery-state.json"
            echo "mode=recovery_failed" >> "$GITHUB_OUTPUT"
            echo "run_worker=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          prior_delivery_state="$(jq -r '.delivery_state // "skipped"' "${recovery_root}/pointer.json")"
          if test "$prior_delivery_state" = "success" || test "$prior_delivery_state" = "failure"; then
            if test -z "$delivery_artifact_name"; then
              jq -n --arg run "$source_run_id" \
                '{schema_version:1,mode:"recovery_failed",run_worker:false,reuse_candidate:false,reason:"delivery_artifact_pointer_missing",source_run_id:$run}' \
                > "${root}/recovery-state.json"
              echo "mode=recovery_failed" >> "$GITHUB_OUTPUT"
              echo "run_worker=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            set +e
            gh run download "$source_run_id" --repo "$GITHUB_REPOSITORY" \
              --name "$delivery_artifact_name" --dir "${recovery_root}/delivery" \
              >"${recovery_root}/delivery-download.stdout" 2>"${recovery_root}/delivery-download.stderr"
            delivery_download_rc="$?"
            set -e
            if test "$delivery_download_rc" -ne 0 || ! test -s "${recovery_root}/delivery/delivery-run.json"; then
              jq -n --arg run "$source_run_id" --arg artifact "$delivery_artifact_name" \
                '{schema_version:1,mode:"recovery_failed",run_worker:false,reuse_candidate:false,reason:"delivery_artifact_unavailable_expired_or_incomplete",source_run_id:$run,delivery_artifact_name:$artifact}' \
                > "${root}/recovery-state.json"
              echo "mode=recovery_failed" >> "$GITHUB_OUTPUT"
              echo "run_worker=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif test "$prior_delivery_state" = "skipped"; then
            if test -n "$delivery_artifact_name"; then
              jq -n --arg run "$source_run_id" \
                '{schema_version:1,mode:"recovery_failed",run_worker:false,reuse_candidate:false,reason:"delivery_pointer_state_mismatch",source_run_id:$run}' \
                > "${root}/recovery-state.json"
              echo "mode=recovery_failed" >> "$GITHUB_OUTPUT"
              echo "run_worker=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            jq -n --arg run "$source_run_id" \
              '{schema_version:1,mode:"recovery_failed",run_worker:false,reuse_candidate:false,reason:"delivery_pointer_state_invalid",source_run_id:$run}' \
              > "${root}/recovery-state.json"
            echo "mode=recovery_failed" >> "$GITHUB_OUTPUT"
            echo "run_worker=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          prior_base_sha="$(jq -r '.base_sha' "${recovery_root}/pointer.json")"
          prior_contract_fingerprint="$(jq -r '.contract_fingerprint' "${recovery_root}/pointer.json")"
          exact_root="${recovery_root}/exact-base"
          set +e
          git worktree add --detach "$exact_root" "$prior_base_sha" \
            >"${recovery_root}/worktree.stdout" 2>"${recovery_root}/worktree.stderr"
          worktree_rc="$?"
          set -e
          if test "$worktree_rc" -ne 0; then
            jq -n --arg run "$source_run_id" \
              '{schema_version:1,mode:"recovery_failed",run_worker:false,reuse_candidate:false,reason:"candidate_base_unavailable",source_run_id:$run}' \
              > "${root}/recovery-state.json"
            echo "mode=recovery_failed" >> "$GITHUB_OUTPUT"
            echo "run_worker=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python3 "${root}/trusted-candidate.py" restore \
            --repo "$exact_root" \
            --candidate-dir "${recovery_root}/candidate" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-issue-number "$ISSUE_NUMBER" \
            --expected-base-sha "$prior_base_sha" \
            --expected-contract-fingerprint "$prior_contract_fingerprint" \
            >"${recovery_root}/exact-restore.stdout" 2>"${recovery_root}/exact-restore.stderr"
          exact_restore_rc="$?"
          set -e
          git worktree remove --force "$exact_root"
          if test "$exact_restore_rc" -ne 0; then
            jq -n --arg run "$source_run_id" \
              '{schema_version:1,mode:"recovery_failed",run_worker:false,reuse_candidate:false,reason:"candidate_exact_restore_failed",source_run_id:$run}' \
              > "${root}/recovery-state.json"
            echo "mode=recovery_failed" >> "$GITHUB_OUTPUT"
            echo "run_worker=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          decision_args=(
            decide
            --current-contract "${root}/contract.json"
            --pointer "${recovery_root}/pointer.json"
            --candidate-manifest "${recovery_root}/candidate/candidate.json"
            --repository "$GITHUB_REPOSITORY"
            --issue-number "$ISSUE_NUMBER"
            --output "${root}/recovery-state.json"
          )
          if test -s "${recovery_root}/verify/verify-run.json"; then
            decision_args+=(--verify-run "${recovery_root}/verify/verify-run.json")
          fi
          if test -s "${recovery_root}/delivery/delivery-run.json"; then
            decision_args+=(--delivery-run "${recovery_root}/delivery/delivery-run.json")
          fi
          python3 "${root}/trusted-recovery.py" "${decision_args[@]}"

          mode="$(jq -r '.mode' "${root}/recovery-state.json")"
          run_worker="$(jq -r '.run_worker' "${root}/recovery-state.json")"



          if test "$mode" = "recoverable"; then
            if test "$prior_base_sha" = "$CURRENT_BASE_SHA"; then
              python3 "${root}/trusted-candidate.py" restore \
                --repo "$GITHUB_WORKSPACE" \
                --candidate-dir "${recovery_root}/candidate" \
                --expected-repository "$GITHUB_REPOSITORY" \
                --expected-issue-number "$ISSUE_NUMBER" \
                --expected-base-sha "$prior_base_sha" \
                --expected-contract-fingerprint "$current_fingerprint" \
                >"${recovery_root}/workspace-restore.json"
              git reset
              jq '.base_strategy="exact_base_restore"' "${root}/recovery-state.json" > "${root}/recovery-state.tmp"
              mv "${root}/recovery-state.tmp" "${root}/recovery-state.json"
            elif git merge-base --is-ancestor "$prior_base_sha" "$CURRENT_BASE_SHA"; then
              set +e
              git apply --3way --index --whitespace=nowarn -- "${recovery_root}/candidate/candidate.patch" \
                >"${recovery_root}/rebase.stdout" 2>"${recovery_root}/rebase.stderr"
              rebase_rc="$?"
              set -e
              if test "$rebase_rc" -eq 0; then
                git reset
                jq '.base_strategy="base_advanced_clean_3way"' "${root}/recovery-state.json" > "${root}/recovery-state.tmp"
                mv "${root}/recovery-state.tmp" "${root}/recovery-state.json"
              else
                git reset --hard "$CURRENT_BASE_SHA"
                git clean -fd
                jq '.mode="recovery_failed" | .run_worker=false | .reuse_candidate=false | .reason="base_advanced_3way_conflict" | .base_strategy="conflict_fail_closed"' \
                  "${root}/recovery-state.json" > "${root}/recovery-state.tmp"
                mv "${root}/recovery-state.tmp" "${root}/recovery-state.json"
                mode="recovery_failed"
                run_worker="false"
              fi
            else
              jq '.mode="recovery_failed" | .run_worker=false | .reuse_candidate=false | .reason="candidate_base_diverged_from_current_base" | .base_strategy="diverged_fail_closed"' \
                "${root}/recovery-state.json" > "${root}/recovery-state.tmp"
              mv "${root}/recovery-state.tmp" "${root}/recovery-state.json"
              mode="recovery_failed"
              run_worker="false"
            fi
          fi

          export RECOVERY_STATE_FILE="${root}/recovery-state.json"
          export RECOVERY_CONTEXT_FILE="${root}/recovery-context.txt"
          export VERIFY_LOG="${recovery_root}/verify/verification.log"
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          state = json.loads(Path(os.environ["RECOVERY_STATE_FILE"]).read_text())
          verify_log = Path(os.environ["VERIFY_LOG"])
          verification = verify_log.read_text(errors="replace")[:12000] if verify_log.exists() else "(none)"
          text = [
              "Mira Candidate Recovery context",
              f"- mode: {state.get('mode')}",
              f"- source run: {state.get('source_run_id')}",
              f"- source base: {state.get('source_base_sha')}",
              f"- reason: {state.get('reason')}",
              f"- base strategy: {state.get('base_strategy', 'none')}",
              "",
              "Trusted prior verification evidence (if present):",
              verification,
              "",
              "Rules:",
              "- Existing restored code is prior Candidate work. Inspect and continue it; do not discard it merely to restart.",
              "- Prior Worker narrative is not a trusted PASS.",
              "- If prior verification failed, address that evidence first before repeating unrelated discovery.",
              "- Contract drift means the old Candidate was NOT restored; implement only the current contract.",
          ]
          Path(os.environ["RECOVERY_CONTEXT_FILE"]).write_text("\n".join(text) + "\n")
          PY

          {
            echo "mode=$mode"
            echo "run_worker=$run_worker"
            echo "source_run_id=$source_run_id"
          } >> "$GITHUB_OUTPUT"

      - name: Enforce Recovery fail-closed boundary
        id: recovery_gate
        if: ${{ steps.recovery.outputs.mode == 'recovery_failed' }}
        shell: bash
        env:
          RECOVERY_MODE: ${{ steps.recovery.outputs.mode }}
        run: |
          set -euo pipefail
          echo "::error::Recovery stopped before model execution: ${RECOVERY_MODE}."
          cat "${RUNNER_TEMP}/mira-worker/recovery-state.json" >&2
          exit 1

      - name: Report already delivered Candidate
        if: ${{ steps.recovery.outputs.mode == 'delivery_complete' }}
        shell: bash
        run: |
          echo "::notice::The latest trusted Candidate is already delivered. No Worker, Verify, or Delivery work is required."

      - name: Resolve run-scoped Worker provider route
        if: ${{ steps.recovery.outputs.run_worker == 'true' }}
        id: provider
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PROVIDER: ${{ inputs.provider }}
          REQUESTED_MODEL: ${{ inputs.model }}
          PROVIDER_PROFILE: ${{ inputs.provider_profile }}
          PROVIDER_REGISTRY_REF: ${{ inputs.provider_registry_ref }}
          FREE_MODE: ${{ inputs.free_mode }}
        run: |
          set -euo pipefail

          root="${RUNNER_TEMP}/mira-worker"
          provider="${REQUESTED_PROVIDER:-opencode-go}"
          model="${REQUESTED_MODEL:-deepseek-v4.1-flash}"
          profile="${PROVIDER_PROFILE:-}"
          registry_ref="${PROVIDER_REGISTRY_REF:-}"

          if test "$FREE_MODE" = "true"; then
            if test "$provider" != "opencode" || test -n "$profile" || test -n "$registry_ref"; then
              echo "::error::Free Worker requires native opencode without a custom provider profile." >&2
              exit 1
            fi
            # Add models only after a native CLI and tool-call smoke.
            case "$model" in
              deepseek-v4.1-flash-free|mimo-v2.6-flash-free) ;;
              *) echo "::error::Model is not on validated free allowlist." >&2; exit 1 ;;
            esac
            curl -fsSL --retry 2 https://opencode.ai/inference/v1/models |
              jq -e --arg model "$model" '.data | any(.id == $model)' >/dev/null
          fi

          if [[ ! "$provider" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid provider identifier '${provider}'." >&2
            exit 1
          fi
          if [[ ! "$model" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]*$ || "$model" == */ || "$model" == *//* ]]; then
            echo "::error::Invalid model identifier '${model}'." >&2
            exit 1
          fi

          provider_config='{}'
          effective_registry_ref='builtin'
          provider_registry_sha='none'

          if test -n "$profile"; then
            if [[ ! "$profile" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
              echo "::error::Invalid provider profile '${profile}'." >&2
              exit 1
            fi
            if [[ ! "$registry_ref" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::provider_profile requires an immutable 40-character provider_registry_ref." >&2
              exit 1
            fi

            registry_file="${root}/provider-registry.json"
            registry_path=".github/mira-external-worker-providers.json"
            provider_registry_sha="$(gh api "repos/uichat-mira/.github/commits/${registry_ref}" --jq '.sha')"
            test "$provider_registry_sha" = "$registry_ref"

            registry_content="$(gh api "repos/uichat-mira/.github/contents/${registry_path}?ref=${registry_ref}" --jq '.content')"
            printf '%s' "$registry_content" | tr -d '\n' | base64 --decode > "$registry_file"
            test -s "$registry_file"

            jq -e '.schema_version == 1 and (.profiles | type == "object")' "$registry_file" >/dev/null

            profile_provider="$(jq -r --arg profile "$profile" '.profiles[$profile].provider_id // ""' "$registry_file")"
            if test -z "$profile_provider"; then
              echo "::error::Unknown provider profile '${profile}'." >&2
              exit 1
            fi
            if test "$profile_provider" != "$provider"; then
              echo "::error::Provider '${provider}' does not match profile '${profile}' provider_id '${profile_provider}'." >&2
              exit 1
            fi

            if ! jq -e --arg profile "$profile" --arg model "$model" '
              (.profiles[$profile].config | type == "object")
              and (.profiles[$profile].config.npm | type == "string")
              and (.profiles[$profile].config.npm | length > 0)
              and (
                (.profiles[$profile].config.options.baseURL // "") == ""
                or (.profiles[$profile].config.options.baseURL | test("^https://"))
              )
              and (.profiles[$profile].config.models | type == "object")
              and (.profiles[$profile].config.models | has($model))
            ' "$registry_file" >/dev/null; then
              echo "::error::Provider profile '${profile}' does not allow model '${model}' or has invalid config." >&2
              exit 1
            fi

            provider_config="$(jq -c --arg provider "$provider" --arg profile "$profile"               '{($provider): (.profiles[$profile].config // {})}' "$registry_file")"
            effective_registry_ref="$registry_ref"
          else
            if test "$provider" != "opencode-go" && { test "$FREE_MODE" != "true" || test "$provider" != "opencode"; }; then
              echo "::error::Provider '${provider}' requires a frozen provider_profile." >&2
              exit 1
            fi
          fi

          model_route="${provider}/${model}"

          jq -n             --arg provider "$provider"             --arg model "$model"             --arg model_route "$model_route"             --arg provider_profile "$profile"             --arg provider_registry_ref "$effective_registry_ref"             --arg provider_registry_sha "$provider_registry_sha"             --argjson provider_config "$provider_config"             '{
              provider: $provider,
              model: $model,
              model_route: $model_route,
              provider_profile: $provider_profile,
              provider_registry_ref: $provider_registry_ref,
              provider_registry_sha: $provider_registry_sha,
              provider_config: $provider_config
            }' > "${root}/provider-route.json"

          {
            echo "provider=${provider}"
            echo "provider_profile=${profile}"
            echo "provider_registry_ref=${effective_registry_ref}"
            echo "provider_registry_sha=${provider_registry_sha}"
            echo "model=${model}"
            echo "model_route=${model_route}"
          } >> "${root}/identity.txt"

          echo "provider=${provider}" >> "$GITHUB_OUTPUT"
          echo "provider_profile=${profile}" >> "$GITHUB_OUTPUT"
          echo "provider_registry_ref=${effective_registry_ref}" >> "$GITHUB_OUTPUT"
          echo "provider_registry_sha=${provider_registry_sha}" >> "$GITHUB_OUTPUT"
          echo "model=${model}" >> "$GITHUB_OUTPUT"
          echo "model_route=${model_route}" >> "$GITHUB_OUTPUT"

      - name: Load current Organization policy and pinned Skill
        if: ${{ steps.recovery.outputs.run_worker == 'true' }}
        id: policy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.agents/skills/execute-work-item"

          gh api "repos/uichat-mira/.github/contents/AGENTS.md?ref=main"             --jq '.content'             | tr -d '\n'             | base64 --decode             > "${RUNNER_TEMP}/mira-worker/org-AGENTS.md"

          gh api "repos/uichat-mira/.github/contents/skills/execute-work-item/SKILL.md?ref=d8ba9f80b5736fa10e4ac10041b501ff5d39e5d9"             --jq '.content'             | tr -d '\n'             | base64 --decode             > "${HOME}/.agents/skills/execute-work-item/SKILL.md"

          test -s "${RUNNER_TEMP}/mira-worker/org-AGENTS.md"
          test -s "${HOME}/.agents/skills/execute-work-item/SKILL.md"
          if test "${{ inputs.free_mode }}" = "true"; then
            # Fail closed if the checkout can override or extend V2 Skill resolution.
            # This intentionally rejects project OpenCode configuration rather than
            # guessing precedence across local, explicit, and global Skill sources.
            for local_config in opencode.json opencode.jsonc .opencode.json .opencode.jsonc; do
              if test -e "$local_config" || test -L "$local_config"; then
                echo "::error::Free Worker refuses project OpenCode config: $local_config" >&2
                exit 1
              fi
            done
            for local_source in .opencode .agents .claude; do
              if test -e "$local_source" || test -L "$local_source"; then
                echo "::error::Free Worker refuses project Skill/config source: $local_source" >&2
                exit 1
              fi
            done
            # Also catch a colliding SKILL.md under non-standard directories.
            if find . -type f -path '*/execute-work-item/SKILL.md' -print -quit | grep -q .; then
              echo "::error::Free Worker refuses a project-defined execute-work-item Skill." >&2
              exit 1
            fi
            # OpenCode V2 discovers its own native global skills directory; the
            # legacy ~/.agents source is not reliable across V2 releases.
            mkdir -p "${HOME}/.config/opencode/skills/execute-work-item"
            cp "${HOME}/.agents/skills/execute-work-item/SKILL.md" \
              "${HOME}/.config/opencode/skills/execute-work-item/SKILL.md"
            cmp -s "${HOME}/.agents/skills/execute-work-item/SKILL.md" \
              "${HOME}/.config/opencode/skills/execute-work-item/SKILL.md"
          fi
          test -s AGENTS.md

      - name: Install pinned OpenCode CLI
        if: ${{ steps.recovery.outputs.run_worker == 'true' }}
        id: install
        shell: bash
        run: |
          set -euo pipefail
          if test "${{ inputs.free_mode }}" = "true"; then
            curl -fsSL https://opencode.ai/v2/install | bash -s -- --version 2.0.24
          else
            curl -fsSL https://opencode.ai/install | bash -s -- --version 1.18.34
          fi
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Verify OpenCode version
        if: ${{ steps.recovery.outputs.run_worker == 'true' }}
        id: version
        shell: bash
        run: |
          set -euo pipefail
          actual="$(opencode --version)"
          if test "${{ inputs.free_mode }}" = "true"; then
            test "$actual" = "opencode v2.0.24"
          else
            test "$actual" = "1.18.34"
          fi

      - name: Run bounded external Worker
        if: ${{ steps.recovery.outputs.run_worker == 'true' }}
        id: worker
        shell: bash
        env:
          PROVIDER: ${{ steps.provider.outputs.provider }}
          FREE_MODE: ${{ inputs.free_mode }}
          MODEL_ROUTE: ${{ steps.provider.outputs.model_route }}
          OPENCODE_GO_API_KEY: ${{ secrets.opencode_go_api_key }}
          PROVIDER_API_KEY: ${{ secrets.provider_api_key }}
          OPENCODE_DISABLE_AUTOUPDATE: "1"
          OPENCODE_DISABLE_DEFAULT_PLUGINS: "1"
          OPENCODE_DISABLE_LSP_DOWNLOAD: "1"
          OPENCODE_DISABLE_MODELS_FETCH: "1"
          NO_COLOR: "1"
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          SOFT_BUDGET_MINUTES: ${{ inputs.timeout_minutes }}
        run: |
          set -euo pipefail

          route="${RUNNER_TEMP}/mira-worker/provider-route.json"
          test -s "$route"

          if test "$FREE_MODE" = "true"; then
            if test "$PROVIDER" != "opencode" || test -n "${OPENCODE_GO_API_KEY:-}" || test -n "${PROVIDER_API_KEY:-}"; then
              echo "::error::Free Worker rejects paid credentials or non-native provider." >&2
              exit 1
            fi
            # Preserve official CLI's native free-provider support; disable only credential injection.
            unset OPENCODE_AUTH_CONTENT OPENCODE_DISABLE_MODELS_FETCH OPENCODE_DISABLE_DEFAULT_PLUGINS
          else
            if test "$PROVIDER" = "opencode-go" && test -z "${PROVIDER_API_KEY:-}"; then
              provider_key="${OPENCODE_GO_API_KEY:-}"
            else
              provider_key="${PROVIDER_API_KEY:-}"
            fi
            if test -z "$provider_key"; then
              echo "::error::No credential available for provider '${PROVIDER}'." >&2
              exit 1
            fi

            export OPENCODE_AUTH_CONTENT
            # $provider and $key below are jq variables, not shell variables.
            # shellcheck disable=SC2016
            OPENCODE_AUTH_CONTENT="$(jq -cn --arg provider "$PROVIDER" --arg key "$provider_key" '{($provider):{"type":"api","key":$key}}')"
            unset OPENCODE_GO_API_KEY PROVIDER_API_KEY provider_key
          fi

          export OPENCODE_CONFIG_CONTENT
          if test "$FREE_MODE" = "true"; then
            # OpenCode V2 uses ordered "permissions" rules with "shell"/"subagent".
            # V1 "permission" / "bash" config is NOT understood by the V2 CLI.
            OPENCODE_CONFIG_CONTENT="$(jq -cn '{
              share: "disabled",
              permissions: [
                {action:"read",resource:"*",effect:"allow"},
                {action:"read",resource:"*.env*",effect:"deny"},
                {action:"glob",resource:"*",effect:"allow"},
                {action:"grep",resource:"*",effect:"allow"},
                {action:"edit",resource:"*",effect:"allow"},
                {action:"skill",resource:"*",effect:"deny"},
                {action:"skill",resource:"execute-work-item",effect:"allow"},
                {action:"shell",resource:"*",effect:"allow"},
                {action:"subagent",resource:"*",effect:"deny"},
                {action:"webfetch",resource:"*",effect:"allow"},
                {action:"websearch",resource:"*",effect:"allow"},
                {action:"external_directory",resource:"*",effect:"deny"},
                {action:"execute",resource:"*",effect:"deny"}
              ]
            }')"
          else
            OPENCODE_CONFIG_CONTENT="$(
              jq -cn --slurpfile route "$route" '
                {
                  "share": "disabled",
                  "autoupdate": false,
                  "permission": {
                    "read": "allow",
                    "glob": "allow",
                    "grep": "allow",
                    "list": "allow",
                    "skill": "allow",
                    "edit": "allow",
                    "write": "allow",
                    "bash": "allow",
                    "task": "deny",
                    "webfetch": "allow",
                    "websearch": "allow",
                    "question": "deny",
                    "external_directory": "deny"
                  }
                }
                + (if (($route[0].provider_config // {}) | length) == 0 then {}
                   else {"provider": $route[0].provider_config}
                   end)
              '
            )"
          fi

          issue_title="$(jq -r '.title' "${RUNNER_TEMP}/mira-worker/issue.json")"
          issue_body="$(jq -r '.body // ""' "${RUNNER_TEMP}/mira-worker/issue.json")"
          maintainer_amendments="$(jq -r '
            if length == 0 then
              "(none)"
            else
              map(
                "COMMENT #\(.id) by @\(.author) at \(.created_at)\n\(.body)"
              )
              | join("\n\n---\n\n")
            end
          ' "${RUNNER_TEMP}/mira-worker/maintainer-comments.json")"
          org_policy="$(cat "${RUNNER_TEMP}/mira-worker/org-AGENTS.md")"
          recovery_context="$(cat "${RUNNER_TEMP}/mira-worker/recovery-context.txt" 2>/dev/null || printf '%s\n' 'No Recovery context.')"

          cat > "${RUNNER_TEMP}/mira-worker/prompt.txt" <<PROMPT
          You are the implementation Worker for exactly one explicitly authorized Mira engineering work item.

          Control hierarchy for this run:
          1. The maintainer authorized implementation of the assigned Issue.
          2. The current Mira Organization policy below applies.
          3. The repository root AGENTS.md in the checked-out workspace applies.
          4. The execute-work-item Skill is installed and MUST be loaded with OpenCode's native skill tool before editing.
          5. The exact GitHub Issue title/body below is the base work-item contract.
          6. Trusted maintainer follow-up comments below are chronological follow-up context. A comment is eligible only when its author is a human account with current repository write, maintain, or admin permission; bot and ordinary-user comments are excluded. Only an eligible comment that explicitly clarifies, revises, returns, narrows, or otherwise changes the work item acts as a contract amendment. Status/evidence/conversational comments do not change the contract. When explicit amendments conflict, later trusted amendments override earlier trusted amendments and the conflicting part of the base Issue contract. The loaded execute-work-item Skill defines the full amendment semantics; apply it.

          Immutable execution identity:
          - repository: ${GITHUB_REPOSITORY}
          - issue: #${ISSUE_NUMBER}
          - delivery base: ${BASE_BRANCH}
          - base SHA: ${BASE_SHA}

          Advisory work budget: ${SOFT_BUDGET_MINUTES} minutes. This is a planning checkpoint, NOT a hard deadline. Do not stop, abandon, or discard useful work merely because this budget has elapsed. Continue when the task needs more time. If a handoff is necessary, leave a coherent implementation checkpoint and an exact account of remaining work. The GitHub-hosted runner's platform execution ceiling is external and cannot be extended by this workflow.

          Important execution constraints:
          - Work only on this Issue.
          - Only supplied eligible trusted maintainer follow-up comments (human authors with current repository write, maintain, or admin permission) can amend the Issue contract, and only when their wording explicitly changes or clarifies the work item. Ordinary acknowledgements, status notes, evidence chatter, or conversational comments do not amend it.
          - Other Issue comments are deliberately excluded and have no authority in this run.
          - Explicit trusted amendments can change implementation scope/acceptance within this Issue, but they do not expand this Worker's authority to merge, close/reopen Issues, release, deploy, or promote environments.
          - Read repository AGENTS.md before editing.
          - Load execute-work-item before editing.
          - Repository read/search/edit/write and shell/terminal are allowed on this ephemeral GitHub-hosted runner for inspecting the code, installing dependencies, running tests/builds, and local debugging. Record commands and results truthfully.
          - Shell/network permission is not authority to push, create/merge PRs, modify unrelated repository or workflow files, deploy, or change secrets. Do not read, log, transmit, or persist credentials/tokens from environment or configuration, including via outbound network requests. Trusted post-run verification and GitHub delivery steps remain authoritative.
          - Web fetch/search and ordinary internet requests are allowed for project documentation, dependencies, research, and implementation. No artificial request-count or usage quota is imposed by this Worker workflow; external service limits, provider availability, and GitHub-hosted runner limits still apply.
          - Subagents and GitHub mutations are unavailable to the Worker as dedicated tools.
          - Do not create commits, branches, pull requests, Issues, releases, or environment promotions.
          - You may run tests, builds, and diagnostics in the Worker runner and report their exact results. The separate trusted post-run verification is still required; your own passing tests do not replace it.
          - If the Issue cannot be implemented safely without a maintainer decision or broader scope, make no speculative workaround and report the blocker.
          - Make the smallest coherent change that satisfies the Issue contract.
          - Never route the native free Worker to paid models or custom provider endpoints.
          - End with a concise handoff listing changed surfaces, reasoning, and any validation gap.

          CURRENT_MIRA_ORGANIZATION_POLICY
          ${org_policy}

          ASSIGNED_ISSUE_BASE_CONTRACT
          Title: ${issue_title}

          ${issue_body}

          TRUSTED_MAINTAINER_FOLLOW_UP
          ${maintainer_amendments}

          CANDIDATE_RECOVERY_CONTEXT
          ${recovery_context}
          PROMPT

          opencode session list --max-count 50 --format json > "${RUNNER_TEMP}/mira-worker/sessions-before.json" 2>/dev/null || printf '[]\n' > "${RUNNER_TEMP}/mira-worker/sessions-before.json"

          set +e
          opencode run             --model "$MODEL_ROUTE"             --agent build             --title "Mira external Worker #${ISSUE_NUMBER}"             "$(cat "${RUNNER_TEMP}/mira-worker/prompt.txt")"             2>&1 | tee "${RUNNER_TEMP}/mira-worker/worker-output.raw"
          worker_rc="${PIPESTATUS[0]}"
          set -e

          python3 - <<'PY'
          from pathlib import Path
          root = Path(__import__("os").environ["RUNNER_TEMP"]) / "mira-worker"
          src = root / "worker-output.raw"
          dst = root / "worker-output.txt"
          limit = 120_000
          data = src.read_bytes() if src.exists() else b""
          truncated = len(data) > limit
          dst.write_bytes(data[:limit] + (b"\n[truncated]\n" if truncated else b""))
          (root / "worker-output-meta.json").write_text(
              __import__("json").dumps({"bytes": len(data), "limit_bytes": limit, "truncated": truncated}) + "\n"
          )
          PY

          opencode session list --max-count 50 --format json > "${RUNNER_TEMP}/mira-worker/sessions-after.json" 2>/dev/null || printf '[]\n' > "${RUNNER_TEMP}/mira-worker/sessions-after.json"

          export OPENCODE_SESSION_ID
          OPENCODE_SESSION_ID="$(python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "mira-worker"

          def ids(path):
              try:
                  value = json.loads(path.read_text())
              except Exception:
                  return []
              if isinstance(value, dict):
                  value = value.get("sessions", value.get("data", []))
              if not isinstance(value, list):
                  return []
              out = []
              for item in value:
                  if not isinstance(item, dict):
                      continue
                  sid = item.get("id") or item.get("sessionID") or item.get("session_id")
                  if isinstance(sid, str):
                      out.append(sid)
              return out

          before = set(ids(root / "sessions-before.json"))
          after = ids(root / "sessions-after.json")
          fresh = [sid for sid in after if sid not in before]
          print((fresh or after or [""])[0])
          PY
          )"

          if test -n "$OPENCODE_SESSION_ID"; then
            if opencode export "$OPENCODE_SESSION_ID" --sanitize > "${RUNNER_TEMP}/mira-worker/session-export.json" 2>/dev/null \
              || opencode session export "$OPENCODE_SESSION_ID" --sanitize > "${RUNNER_TEMP}/mira-worker/session-export.json" 2>/dev/null; then
              python3 - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "mira-worker"
          src = root / "session-export.json"
          out = root / "trajectory.jsonl"
          summary = root / "session-summary.json"
          limit_events = 500

          try:
              data = json.loads(src.read_text(errors="replace"))
          except Exception as exc:
              summary.write_text(json.dumps({"available": False, "error": type(exc).__name__}) + "\n")
              out.write_text("")
              raise SystemExit(0)

          session = data.get("info", {}) if isinstance(data, dict) else {}
          messages = data.get("messages", []) if isinstance(data, dict) else []
          if not isinstance(messages, list):
              messages = []

          events = []
          for msg in messages:
              if not isinstance(msg, dict):
                  continue
              info = msg.get("info", msg)
              if not isinstance(info, dict):
                  info = {}
              mid = info.get("id")
              sid = info.get("sessionID") or session.get("id")
              role = info.get("role")
              parts = msg.get("parts", info.get("parts", []))
              if not isinstance(parts, list):
                  parts = []
              for part in parts:
                  if not isinstance(part, dict):
                      continue
                  kind = part.get("type")
                  if kind == "tool":
                      state = part.get("state", {})
                      if not isinstance(state, dict):
                          state = {}
                      timing = state.get("time", {})
                      if not isinstance(timing, dict):
                          timing = {}
                      events.append({
                          "kind": "tool",
                          "session_id": sid,
                          "message_id": mid,
                          "role": role,
                          "tool": part.get("tool") or part.get("toolName"),
                          "call_id": part.get("callID") or part.get("toolCallId"),
                          "status": state.get("status") or part.get("state"),
                          "started_at": timing.get("start"),
                          "ended_at": timing.get("end"),
                      })
                  elif kind in {"step-start", "step-finish", "patch", "retry", "compaction", "subtask"}:
                      events.append({
                          "kind": kind,
                          "session_id": sid,
                          "message_id": mid,
                          "role": role,
                      })

          truncated = len(events) > limit_events
          events = events[:limit_events]
          with out.open("w") as fh:
              for event in events:
                  fh.write(json.dumps(event, separators=(",", ":")) + "\n")

          summary.write_text(json.dumps({
              "available": True,
              "session_id": session.get("id") or os.environ.get("OPENCODE_SESSION_ID"),
              "event_count": len(events),
              "event_limit": limit_events,
              "truncated": truncated,
              "content_policy": "metadata-only; prompt/text/reasoning/tool inputs/tool outputs omitted",
          }, separators=(",", ":")) + "\n")
          PY
              rm -f "${RUNNER_TEMP}/mira-worker/session-export.json"
            else
              printf '{"available":false,"reason":"sanitized_export_unavailable"}\n' > "${RUNNER_TEMP}/mira-worker/session-summary.json"
              : > "${RUNNER_TEMP}/mira-worker/trajectory.jsonl"
            fi
          else
            printf '{"available":false,"reason":"session_id_unresolved"}\n' > "${RUNNER_TEMP}/mira-worker/session-summary.json"
            : > "${RUNNER_TEMP}/mira-worker/trajectory.jsonl"
          fi

          exit "$worker_rc"

      - name: Capture durable Candidate
        id: candidate
        if: ${{ always() && steps.recovery.outputs.run_worker == 'true' && steps.checkout.outcome == 'success' && steps.identity.outcome == 'success' && steps.worker.outcome != 'skipped' }}
        shell: bash
        env:
          PATH: /usr/bin:/bin
          BASH_ENV: ''
          ENV: ''
          PYTHONPATH: ''
          PYTHONHOME: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          PROVIDER: ${{ steps.provider.outputs.provider }}
          MODEL: ${{ steps.provider.outputs.model }}
          WORKER_OUTCOME: ${{ steps.worker.outcome }}
        run: |
          set -euo pipefail

          root="${RUNNER_TEMP}/mira-worker"
          /usr/bin/curl -fsSL --retry 2 --proto '=https' --tlsv1.2 \
            "https://raw.githubusercontent.com/uichat-mira/.github/c5d93e149765f9068f3d342d2aed3a40a8f20efc/.github/scripts/worker-candidate/candidate.py" \
            -o "${root}/trusted-candidate.py"
          test -s "${root}/trusted-candidate.py"
          echo "candidate_tool_commit=c5d93e149765f9068f3d342d2aed3a40a8f20efc" >> "${root}/identity.txt"

          candidate_dir="${root}/candidate"
          status_file="${root}/candidate-status.json"
          artifact_name="mira-external-worker-candidate-${ISSUE_NUMBER}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$root"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

          if git diff --quiet "$BASE_SHA" -- && test -z "$(git ls-files --others --exclude-standard)"; then
            export CANDIDATE_STATUS_FILE="$status_file"
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ["CANDIDATE_STATUS_FILE"]).write_text(json.dumps({
              "schema_version": 1,
              "state": "unavailable",
              "recoverable": False,
              "reason": "no_changes",
          }, indent=2, sort_keys=True) + "\n")
          PY
            echo "state=unavailable" >> "$GITHUB_OUTPUT"
            echo "recoverable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          export CONTRACT_FINGERPRINT
          CONTRACT_FINGERPRINT="${{ steps.recovery.outputs.contract_fingerprint }}"
          test -n "$CONTRACT_FINGERPRINT"

          rm -rf "$candidate_dir"
          set +e
          python3 "$root/trusted-candidate.py" capture \
            --repo "$GITHUB_WORKSPACE" \
            --output "$candidate_dir" \
            --repository "$GITHUB_REPOSITORY" \
            --issue-number "$ISSUE_NUMBER" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --base-branch "$BASE_BRANCH" \
            --base-sha "$BASE_SHA" \
            --contract-fingerprint "$CONTRACT_FINGERPRINT" \
            --worker-outcome "${WORKER_OUTCOME:-unknown}" \
            --provider "${PROVIDER:-}" \
            --model "${MODEL:-}" \
            > "$root/candidate-capture.stdout" \
            2> "$root/candidate-capture.stderr"
          candidate_rc="$?"
          set -e

          export CANDIDATE_RC="$candidate_rc"
          export CANDIDATE_STATUS_FILE="$status_file"
          export CANDIDATE_DIR="$candidate_dir"
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          status_path = Path(os.environ["CANDIDATE_STATUS_FILE"])
          candidate_dir = Path(os.environ["CANDIDATE_DIR"])
          rc = int(os.environ["CANDIDATE_RC"])
          if rc == 0:
              manifest = json.loads((candidate_dir / "candidate.json").read_text())
              payload = {
                  "schema_version": 1,
                  "state": "captured",
                  "recoverable": False,
                  "reason": "awaiting_artifact_upload",
                  "manifest": {
                      "schema_version": manifest.get("schema_version"),
                      "base_sha": manifest.get("base_sha"),
                      "contract_fingerprint": manifest.get("contract_fingerprint"),
                      "candidate_patch_sha256": manifest.get("candidate_patch_sha256"),
                      "candidate_patch_bytes": manifest.get("candidate_patch_bytes"),
                      "candidate_tree_oid": manifest.get("candidate_tree_oid"),
                      "worker_outcome": manifest.get("worker_outcome"),
                      "provider": manifest.get("provider"),
                      "model": manifest.get("model"),
                  },
              }
          else:
              stderr_path = Path(os.environ["RUNNER_TEMP"]) / "mira-worker" / "candidate-capture.stderr"
              error = stderr_path.read_text(errors="replace")[:4000] if stderr_path.exists() else ""
              payload = {
                  "schema_version": 1,
                  "state": "rejected" if rc == 2 else "capture_failed",
                  "recoverable": False,
                  "reason": "candidate_contract_rejected" if rc == 2 else "candidate_capture_failed",
                  "capture_exit_code": rc,
                  "error": error,
              }
          status_path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY

          if test "$candidate_rc" -eq 0; then
            patch_sha256="$(jq -r '.candidate_patch_sha256' "$candidate_dir/candidate.json")"
            tree_oid="$(jq -r '.candidate_tree_oid' "$candidate_dir/candidate.json")"
            contract_fingerprint="$(jq -r '.contract_fingerprint' "$candidate_dir/candidate.json")"
            test -n "$patch_sha256"
            test -n "$tree_oid"
            test -n "$contract_fingerprint"
            {
              echo "state=captured"
              echo "recoverable=false"
              echo "patch_sha256=$patch_sha256"
              echo "tree_oid=$tree_oid"
              echo "contract_fingerprint=$contract_fingerprint"
            } >> "$GITHUB_OUTPUT"
          else
            if test "$candidate_rc" -eq 2; then
              echo "state=rejected" >> "$GITHUB_OUTPUT"
            else
              echo "state=capture_failed" >> "$GITHUB_OUTPUT"
            fi
            echo "recoverable=false" >> "$GITHUB_OUTPUT"
            exit "$candidate_rc"
          fi

      - name: Upload durable Candidate
        id: candidate_upload
        if: ${{ always() && steps.candidate.outputs.state == 'captured' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/mira-worker/candidate/candidate.patch
            ${{ runner.temp }}/mira-worker/candidate/candidate.json
          if-no-files-found: error
          retention-days: 14

      - name: Require a bounded implementation change
        id: bounded
        if: ${{ steps.recovery.outputs.run_worker == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet "$BASE_SHA" -- && test -z "$(git ls-files --others --exclude-standard)"; then
            echo "Worker produced no implementation changes." >&2
            exit 1
          fi

          git diff --check

      - name: Re-publish verified Candidate for Delivery-only retry
        id: recovered_candidate_upload
        if: ${{ steps.recovery.outputs.mode == 'delivery_retry_only' }}
        uses: actions/upload-artifact@v4
        with:
          name: mira-external-worker-candidate-${{ inputs.issue_number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mira-worker/recovery/candidate/candidate.patch
            ${{ runner.temp }}/mira-worker/recovery/candidate/candidate.json
          if-no-files-found: error
          retention-days: 14

      - name: Re-publish trusted Verify evidence for Delivery-only retry
        id: recovered_verify_upload
        if: ${{ steps.recovery.outputs.mode == 'delivery_retry_only' }}
        uses: actions/upload-artifact@v4
        with:
          name: mira-external-worker-verify-recovered-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mira-worker/recovery/verify/verify-run.json
            ${{ runner.temp }}/mira-worker/recovery/verify/verification.log
            ${{ runner.temp }}/mira-worker/recovery/verify/verification-meta.json
            ${{ runner.temp }}/mira-worker/recovery/verify/restore-result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Resolve Candidate handoff
        id: handoff
        if: always()
        shell: bash
        env:
          RECOVERY_MODE: ${{ steps.recovery.outputs.mode }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          CURRENT_BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          CURRENT_BASE_BRANCH: ${{ inputs.base_branch }}
          CURRENT_WORKER_BRANCH: ${{ steps.identity.outputs.worker_branch }}
          RECOVERY_SOURCE_RUN_ID: ${{ steps.recovery.outputs.source_run_id }}
          CONTRACT_FINGERPRINT: ${{ steps.recovery.outputs.contract_fingerprint }}
          AMBIGUITY_GUARD: ${{ steps.recovery.outputs.ambiguity_guard }}
          NORMAL_CANDIDATE_NAME: ${{ steps.candidate.outputs.artifact_name }}
          NORMAL_CANDIDATE_ID: ${{ steps.candidate_upload.outputs.artifact-id }}
          NORMAL_CANDIDATE_DIGEST: ${{ steps.candidate_upload.outputs.artifact-digest }}
          NORMAL_PATCH: ${{ steps.candidate.outputs.patch_sha256 }}
          NORMAL_TREE: ${{ steps.candidate.outputs.tree_oid }}
          NORMAL_PROVIDER: ${{ steps.provider.outputs.provider }}
          NORMAL_MODEL: ${{ steps.provider.outputs.model }}
          NORMAL_PROVIDER_PROFILE: ${{ steps.provider.outputs.provider_profile }}
          NORMAL_PROVIDER_REGISTRY_REF: ${{ steps.provider.outputs.provider_registry_ref }}
          NORMAL_MODEL_ROUTE: ${{ steps.provider.outputs.model_route }}
          RECOVERED_CANDIDATE_ID: ${{ steps.recovered_candidate_upload.outputs.artifact-id }}
          RECOVERED_CANDIDATE_DIGEST: ${{ steps.recovered_candidate_upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/mira-worker"
          mode="${RECOVERY_MODE:-fresh}"

          echo "recovery_mode=$mode" >> "$GITHUB_OUTPUT"
          echo "recovery_source_run_id=${RECOVERY_SOURCE_RUN_ID:-}" >> "$GITHUB_OUTPUT"
          echo "contract_fingerprint=${CONTRACT_FINGERPRINT:-}" >> "$GITHUB_OUTPUT"
          echo "ambiguity_guard=${AMBIGUITY_GUARD:-}" >> "$GITHUB_OUTPUT"

          if test "$mode" = "delivery_complete"; then
            pointer="$root/recovery/pointer.json"
            test -s "$pointer"
            {
              echo "candidate_base_sha=$(jq -r '.base_sha' "$pointer")"
              echo "candidate_origin_run_id=$(jq -r '.candidate_origin_run_id' "$pointer")"
              echo "candidate_origin_run_attempt=$(jq -r '.candidate_origin_run_attempt' "$pointer")"
              echo "candidate_base_branch=$(jq -r '.base_branch' "$pointer")"
              echo "worker_branch=$(jq -r '.worker_branch' "$pointer")"
              echo "pull_request_url=$(jq -r '.draft_pr_url' "$pointer")"
              echo "candidate_artifact_name=$(jq -r '.candidate_artifact_name' "$pointer")"
              echo "candidate_artifact_id=$(jq -r '.candidate_artifact_id' "$pointer")"
              echo "candidate_artifact_digest=$(jq -r '.candidate_artifact_digest' "$pointer")"
              echo "candidate_patch_sha256=$(jq -r '.candidate_patch_sha256' "$pointer")"
              echo "candidate_tree_oid=$(jq -r '.candidate_tree_oid' "$pointer")"
              echo "contract_fingerprint=$(jq -r '.contract_fingerprint' "$pointer")"
              echo "ambiguity_guard=$(jq -r '.ambiguity_guard' "$pointer")"
              echo "verification_artifact_name=$(jq -r '.verification_artifact_name' "$pointer")"
              echo "verified_patch_sha256=$(jq -r '.candidate_patch_sha256' "$pointer")"
              echo "verified_tree_oid=$(jq -r '.candidate_tree_oid' "$pointer")"
              echo "verified_contract_fingerprint=$(jq -r '.contract_fingerprint' "$pointer")"
              echo "provider=$(jq -r '.provider // ""' "$pointer")"
              echo "provider_profile=$(jq -r '.provider_profile // ""' "$pointer")"
              echo "provider_registry_ref=$(jq -r '.provider_registry_ref // ""' "$pointer")"
              echo "model_route=$(jq -r '.model_route // ""' "$pointer")"
              echo "model=$(jq -r '.model // ""' "$pointer")"
            } >> "$GITHUB_OUTPUT"
          elif test "$mode" = "delivery_retry_only"; then
            manifest="$root/recovery/candidate/candidate.json"
            verify_run="$root/recovery/verify/verify-run.json"
            test -s "$manifest"
            test -s "$verify_run"
            candidate_base="$(jq -r '.base_sha' "$manifest")"
            candidate_origin_run_id="$(jq -r '.run_id' "$manifest")"
            candidate_origin_run_attempt="$(jq -r '.run_attempt' "$manifest")"
            candidate_base_branch="$(jq -r '.base_branch' "$manifest")"
            candidate_worker_branch="feat/worker-${ISSUE_NUMBER}-${candidate_origin_run_id}-${candidate_origin_run_attempt}"
            patch="$(jq -r '.candidate_patch_sha256' "$manifest")"
            tree="$(jq -r '.candidate_tree_oid' "$manifest")"
            contract="$(jq -r '.contract_fingerprint' "$manifest")"
            verify_status="$(jq -r '.terminal_status' "$verify_run")"
            verify_patch="$(jq -r '.candidate_patch_sha256' "$verify_run")"
            verify_tree="$(jq -r '.candidate_tree_oid' "$verify_run")"
            test "$verify_status" = "success"
            test "$patch" = "$verify_patch"
            test "$tree" = "$verify_tree"

            {
              echo "candidate_base_sha=$candidate_base"
              echo "candidate_origin_run_id=$candidate_origin_run_id"
              echo "candidate_origin_run_attempt=$candidate_origin_run_attempt"
              echo "candidate_base_branch=$candidate_base_branch"
              echo "worker_branch=$candidate_worker_branch"
              echo "candidate_artifact_name=mira-external-worker-candidate-${{ inputs.issue_number }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              echo "candidate_artifact_id=${RECOVERED_CANDIDATE_ID:-}"
              echo "candidate_artifact_digest=${RECOVERED_CANDIDATE_DIGEST:-}"
              echo "candidate_patch_sha256=$patch"
              echo "candidate_tree_oid=$tree"
              echo "contract_fingerprint=$contract"
              echo "verification_artifact_name=mira-external-worker-verify-recovered-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              echo "verified_patch_sha256=$verify_patch"
              echo "verified_tree_oid=$verify_tree"
              echo "verified_contract_fingerprint=$contract"
              provider="$(jq -r '.provider // ""' "$root/recovery/pointer.json" 2>/dev/null || true)"
              provider_profile="$(jq -r '.provider_profile // ""' "$root/recovery/pointer.json" 2>/dev/null || true)"
              provider_registry_ref="$(jq -r '.provider_registry_ref // ""' "$root/recovery/pointer.json" 2>/dev/null || true)"
              model_route="$(jq -r '.model_route // ""' "$root/recovery/pointer.json" 2>/dev/null || true)"
              model="$(jq -r '.model // ""' "$root/recovery/pointer.json" 2>/dev/null || true)"
              if test -z "$model"; then
                model="$(jq -r '.model // ""' "$manifest")"
              fi
              if test -z "$provider"; then
                provider="$(jq -r '.provider // ""' "$manifest")"
              fi
              if test -z "$model_route"; then
                model_route="$(jq -r 'if (.provider // "") != "" and (.model // "") != "" then (.provider + "/" + .model) else "" end' "$manifest")"
              fi
              echo "provider=$provider"
              echo "provider_profile=$provider_profile"
              echo "provider_registry_ref=$provider_registry_ref"
              echo "model_route=$model_route"
              echo "model=$model"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "pull_request_url="
              echo "candidate_base_sha=${CURRENT_BASE_SHA:-}"
              echo "candidate_origin_run_id=${GITHUB_RUN_ID}"
              echo "candidate_origin_run_attempt=${GITHUB_RUN_ATTEMPT}"
              echo "candidate_base_branch=${CURRENT_BASE_BRANCH:-}"
              echo "worker_branch=${CURRENT_WORKER_BRANCH:-}"
              echo "candidate_artifact_name=${NORMAL_CANDIDATE_NAME:-}"
              echo "candidate_artifact_id=${NORMAL_CANDIDATE_ID:-}"
              echo "candidate_artifact_digest=${NORMAL_CANDIDATE_DIGEST:-}"
              echo "candidate_patch_sha256=${NORMAL_PATCH:-}"
              echo "candidate_tree_oid=${NORMAL_TREE:-}"
              echo "verification_artifact_name="
              echo "verified_patch_sha256="
              echo "verified_tree_oid="
              echo "verified_contract_fingerprint="
              echo "provider=${NORMAL_PROVIDER:-}"
              echo "provider_profile=${NORMAL_PROVIDER_PROFILE:-}"
              echo "provider_registry_ref=${NORMAL_PROVIDER_REGISTRY_REF:-}"
              echo "model_route=${NORMAL_MODEL_ROUTE:-}"
              echo "model=${NORMAL_MODEL:-}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Finalize Worker/Capture evidence
        id: worker_evidence
        if: always()
        shell: bash
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          RUN_WORKER_BRANCH: ${{ steps.identity.outputs.worker_branch }}
          CANDIDATE_BASE_SHA: ${{ steps.handoff.outputs.candidate_base_sha }}
          WORKER_BRANCH: ${{ steps.handoff.outputs.worker_branch }}
          CANDIDATE_ORIGIN_RUN_ID: ${{ steps.handoff.outputs.candidate_origin_run_id }}
          CANDIDATE_ORIGIN_RUN_ATTEMPT: ${{ steps.handoff.outputs.candidate_origin_run_attempt }}
          VERIFICATION_COMMAND: ${{ inputs.verification_command }}
          REQUESTED_PROVIDER: ${{ inputs.provider }}
          FREE_MODE: ${{ inputs.free_mode }}
          REQUESTED_MODEL: ${{ inputs.model }}
          REQUESTED_PROVIDER_PROFILE: ${{ inputs.provider_profile }}
          REQUESTED_PROVIDER_REGISTRY_REF: ${{ inputs.provider_registry_ref }}
          EFFECTIVE_PROVIDER: ${{ steps.handoff.outputs.provider }}
          EFFECTIVE_PROVIDER_PROFILE: ${{ steps.handoff.outputs.provider_profile }}
          EFFECTIVE_PROVIDER_REGISTRY_REF: ${{ steps.handoff.outputs.provider_registry_ref }}
          EFFECTIVE_MODEL: ${{ steps.handoff.outputs.model }}
          EFFECTIVE_MODEL_ROUTE: ${{ steps.handoff.outputs.model_route }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          PROVIDER_OUTCOME: ${{ steps.provider.outcome }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VERSION_OUTCOME: ${{ steps.version.outcome }}
          WORKER_OUTCOME: ${{ steps.worker.outcome }}
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          CANDIDATE_UPLOAD_OUTCOME: ${{ steps.candidate_upload.outcome }}
          RECOVERED_CANDIDATE_UPLOAD_OUTCOME: ${{ steps.recovered_candidate_upload.outcome }}
          RECOVERED_VERIFY_UPLOAD_OUTCOME: ${{ steps.recovered_verify_upload.outcome }}
          RECOVERY_MODE: ${{ steps.handoff.outputs.recovery_mode }}
          RECOVERY_SOURCE_RUN_ID: ${{ steps.handoff.outputs.recovery_source_run_id }}
          RECOVERY_OUTCOME: ${{ steps.recovery.outcome }}
          RECOVERY_GATE_OUTCOME: ${{ steps.recovery_gate.outcome }}
          CANDIDATE_ARTIFACT_NAME: ${{ steps.handoff.outputs.candidate_artifact_name }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.handoff.outputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.handoff.outputs.candidate_artifact_digest }}
          CANDIDATE_PATCH_SHA256: ${{ steps.handoff.outputs.candidate_patch_sha256 }}
          CANDIDATE_TREE_OID: ${{ steps.handoff.outputs.candidate_tree_oid }}
          CONTRACT_FINGERPRINT: ${{ steps.handoff.outputs.contract_fingerprint }}
          AMBIGUITY_GUARD: ${{ steps.handoff.outputs.ambiguity_guard }}
          BOUNDED_OUTCOME: ${{ steps.bounded.outcome }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/mira-worker"
          mkdir -p "$root"

          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git status --short > "$root/changed-files.txt" || true
            if test -n "${BASE_SHA:-}" && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git diff --name-status "$BASE_SHA" > "$root/candidate-files.txt" || true
              git diff --stat "$BASE_SHA" > "$root/diff-stat.txt" || true
            fi
          fi

          candidate_upload_outcome="${CANDIDATE_UPLOAD_OUTCOME:-}"
          verify_evidence_republish_outcome="skipped"
          if test "${RECOVERY_MODE:-}" = "delivery_retry_only"; then
            candidate_upload_outcome="${RECOVERED_CANDIDATE_UPLOAD_OUTCOME:-}"
            verify_evidence_republish_outcome="${RECOVERED_VERIFY_UPLOAD_OUTCOME:-}"
          fi
          export CANDIDATE_UPLOAD_OUTCOME_EFFECTIVE="$candidate_upload_outcome"
          export VERIFY_EVIDENCE_REPUBLISH_OUTCOME="$verify_evidence_republish_outcome"

          export TERMINAL_STATUS FAILURE_STAGE
          read -r TERMINAL_STATUS FAILURE_STAGE < <(python3 - <<'PY'
          import os
          stages = [
              ("validate", os.getenv("VALIDATE_OUTCOME")),
              ("checkout", os.getenv("CHECKOUT_OUTCOME")),
              ("identity", os.getenv("IDENTITY_OUTCOME")),
              ("recovery", os.getenv("RECOVERY_OUTCOME")),
              ("recovery_gate", os.getenv("RECOVERY_GATE_OUTCOME")),
              ("provider", os.getenv("PROVIDER_OUTCOME")),
              ("policy", os.getenv("POLICY_OUTCOME")),
              ("install", os.getenv("INSTALL_OUTCOME")),
              ("version", os.getenv("VERSION_OUTCOME")),
              ("worker", os.getenv("WORKER_OUTCOME")),
              ("candidate_capture", os.getenv("CANDIDATE_OUTCOME")),
              ("candidate_upload", os.getenv("CANDIDATE_UPLOAD_OUTCOME_EFFECTIVE")),
              ("verify_evidence_republish", os.getenv("VERIFY_EVIDENCE_REPUBLISH_OUTCOME")),
              ("bounded_change", os.getenv("BOUNDED_OUTCOME")),
          ]
          failed = next((name for name, outcome in stages if outcome == "failure"), "")
          terminal = "failure" if failed else ("success" if all(outcome in {"success", "skipped"} for _, outcome in stages) else "incomplete")
          print(terminal, failed or "none")
          PY
          )

          export RUN_ENDED_AT
          RUN_ENDED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          python3 - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "mira-worker"
          identity = {}
          p = root / "identity.txt"
          if p.exists():
              for line in p.read_text(errors="replace").splitlines():
                  if "=" in line:
                      k, v = line.split("=", 1)
                      identity[k.strip()] = v.strip()

          candidate = {"state": "unavailable", "recoverable": False, "reason": "capture_not_attempted"}
          cp = root / "candidate-status.json"
          if cp.exists():
              try:
                  loaded = json.loads(cp.read_text())
                  if isinstance(loaded, dict):
                      candidate = loaded
              except Exception:
                  candidate = {"state": "capture_failed", "recoverable": False, "reason": "invalid_candidate_status"}

          recovery = {
              "mode": os.getenv("RECOVERY_MODE") or "fresh",
              "source_run_id": os.getenv("RECOVERY_SOURCE_RUN_ID") or None,
          }
          rp = root / "recovery-state.json"
          if rp.exists():
              try:
                  loaded_recovery = json.loads(rp.read_text())
                  if isinstance(loaded_recovery, dict):
                      recovery.update(loaded_recovery)
              except Exception:
                  recovery["reason"] = "invalid_recovery_state"

          candidate["capture_outcome"] = os.getenv("CANDIDATE_OUTCOME")
          candidate["upload_outcome"] = os.getenv("CANDIDATE_UPLOAD_OUTCOME_EFFECTIVE")
          candidate["verification_evidence_republish_outcome"] = os.getenv("VERIFY_EVIDENCE_REPUBLISH_OUTCOME")
          candidate["artifact_name"] = os.getenv("CANDIDATE_ARTIFACT_NAME") or None
          candidate["artifact_id"] = os.getenv("CANDIDATE_ARTIFACT_ID") or None
          candidate["artifact_digest"] = os.getenv("CANDIDATE_ARTIFACT_DIGEST") or None
          candidate["candidate_patch_sha256"] = os.getenv("CANDIDATE_PATCH_SHA256") or None
          candidate["candidate_tree_oid"] = os.getenv("CANDIDATE_TREE_OID") or None
          candidate["contract_fingerprint"] = os.getenv("CONTRACT_FINGERPRINT") or None
          candidate["ambiguity_guard"] = os.getenv("AMBIGUITY_GUARD") or None
          candidate["artifact_retention_days"] = 14
          if recovery.get("mode") == "delivery_complete":
              candidate["state"] = "captured"
              candidate["recoverable"] = False
              candidate["reason"] = "prior_candidate_already_delivered"
          if recovery.get("mode") == "delivery_retry_only":
              if (
                  os.getenv("CANDIDATE_UPLOAD_OUTCOME_EFFECTIVE") == "success"
                  and os.getenv("VERIFY_EVIDENCE_REPUBLISH_OUTCOME") == "success"
              ):
                  candidate["state"] = "captured"
                  candidate["recoverable"] = True
                  candidate["reason"] = "verified_candidate_republished_for_delivery_retry"
              else:
                  candidate["state"] = "upload_failed"
                  candidate["recoverable"] = False
                  candidate["reason"] = "recovery_artifact_republication_failed"
          if candidate.get("state") == "captured" and recovery.get("mode") not in {"delivery_retry_only", "delivery_complete"}:
              if os.getenv("CANDIDATE_UPLOAD_OUTCOME") == "success":
                  candidate["recoverable"] = True
                  candidate["reason"] = None
              else:
                  candidate["state"] = "upload_failed"
                  candidate["recoverable"] = False
                  candidate["reason"] = "artifact_upload_failed"

          payload = {
              "schema_version": 2,
              "job_role": "worker_capture",
              "run_id": identity.get("run_id") or os.getenv("GITHUB_RUN_ID"),
              "run_attempt": identity.get("run_attempt") or os.getenv("GITHUB_RUN_ATTEMPT"),
              "repository": os.getenv("GITHUB_REPOSITORY"),
              "issue_number": int(os.getenv("ISSUE_NUMBER")) if os.getenv("ISSUE_NUMBER") else None,
              "base_branch": os.getenv("BASE_BRANCH"),
              "base_sha": os.getenv("BASE_SHA") or identity.get("base_sha"),
              "run_worker_branch": os.getenv("RUN_WORKER_BRANCH") or identity.get("worker_branch"),
              "candidate_base_sha": os.getenv("CANDIDATE_BASE_SHA") or os.getenv("BASE_SHA") or identity.get("base_sha"),
              "worker_branch": os.getenv("WORKER_BRANCH") or identity.get("worker_branch"),
              "candidate_origin_run_id": os.getenv("CANDIDATE_ORIGIN_RUN_ID") or identity.get("run_id"),
              "candidate_origin_run_attempt": os.getenv("CANDIDATE_ORIGIN_RUN_ATTEMPT") or identity.get("run_attempt"),
              "requested_provider": os.getenv("REQUESTED_PROVIDER") or "opencode-go",
              "requested_provider_profile": os.getenv("REQUESTED_PROVIDER_PROFILE") or None,
              "requested_provider_registry_ref": os.getenv("REQUESTED_PROVIDER_REGISTRY_REF") or None,
              "requested_model": os.getenv("REQUESTED_MODEL") or "deepseek-v4.1-flash",
              "provider": os.getenv("EFFECTIVE_PROVIDER") or identity.get("provider"),
              "provider_profile": os.getenv("EFFECTIVE_PROVIDER_PROFILE") or identity.get("provider_profile") or None,
              "provider_registry_ref": os.getenv("EFFECTIVE_PROVIDER_REGISTRY_REF") or identity.get("provider_registry_ref"),
              "provider_registry_sha": identity.get("provider_registry_sha"),
              "model": os.getenv("EFFECTIVE_MODEL") or identity.get("model"),
              "model_route": os.getenv("EFFECTIVE_MODEL_ROUTE") or identity.get("model_route"),
              "skill_commit": identity.get("skill_commit"),
              "started_at": identity.get("run_started_at"),
              "ended_at": os.getenv("RUN_ENDED_AT"),
              "terminal_status": os.getenv("TERMINAL_STATUS"),
              "failure_stage": os.getenv("FAILURE_STAGE"),
              "stages": {
                  "validate": os.getenv("VALIDATE_OUTCOME"),
                  "checkout": os.getenv("CHECKOUT_OUTCOME"),
                  "identity": os.getenv("IDENTITY_OUTCOME"),
                  "provider": os.getenv("PROVIDER_OUTCOME"),
                  "policy": os.getenv("POLICY_OUTCOME"),
                  "install": os.getenv("INSTALL_OUTCOME"),
                  "version": os.getenv("VERSION_OUTCOME"),
                  "worker": os.getenv("WORKER_OUTCOME"),
                  "candidate_capture": os.getenv("CANDIDATE_OUTCOME"),
                  "candidate_upload": os.getenv("CANDIDATE_UPLOAD_OUTCOME_EFFECTIVE"),
                  "verify_evidence_republish": os.getenv("VERIFY_EVIDENCE_REPUBLISH_OUTCOME"),
                  "bounded_change": os.getenv("BOUNDED_OUTCOME"),
              },
              "recovery": recovery,
              "candidate": candidate,
              "verification": {"command": (os.getenv("VERIFICATION_COMMAND") or "")[:4000], "outcome": "pending_clean_room_verify"},
              "delivery": {"outcome": "pending_verified_candidate"},
              "artifact_retention_days": 14,
              "safety": {
                  "github_permissions": {"actions": "read", "contents": "read", "issues": "read", "pull_requests": "none"},
                  "provider_credentials_present": os.getenv("FREE_MODE") != "true" and os.getenv("WORKER_OUTCOME") not in {None, "", "skipped"},
                  "github_write_authority": False,
                  "raw_environment_persisted": False,
                  "provider_credentials_persisted": False,
                  "github_token_persisted": False,
                  "candidate_tool_commit": identity.get("candidate_tool_commit"),
              },
          }
          (root / "worker-run.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY

      - name: Upload Worker/Capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mira-external-worker-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mira-worker/worker-run.json
            ${{ runner.temp }}/mira-worker/identity.txt
            ${{ runner.temp }}/mira-worker/issue.json
            ${{ runner.temp }}/mira-worker/maintainer-comments.json
            ${{ runner.temp }}/mira-worker/provider-route.json
            ${{ runner.temp }}/mira-worker/contract.json
            ${{ runner.temp }}/mira-worker/recovery-state.json
            ${{ runner.temp }}/mira-worker/recovery-context.txt
            ${{ runner.temp }}/mira-worker/recovery/discovery.json
            ${{ runner.temp }}/mira-worker/recovery/pointer.json
            ${{ runner.temp }}/mira-worker/trajectory.jsonl
            ${{ runner.temp }}/mira-worker/session-summary.json
            ${{ runner.temp }}/mira-worker/worker-output.txt
            ${{ runner.temp }}/mira-worker/worker-output-meta.json
            ${{ runner.temp }}/mira-worker/candidate-status.json
            ${{ runner.temp }}/mira-worker/candidate-capture.stdout
            ${{ runner.temp }}/mira-worker/candidate-capture.stderr
            ${{ runner.temp }}/mira-worker/changed-files.txt
            ${{ runner.temp }}/mira-worker/candidate-files.txt
            ${{ runner.temp }}/mira-worker/diff-stat.txt
          if-no-files-found: warn
          retention-days: 14

  verify:
    needs: worker_capture
    if: ${{ needs.worker_capture.result == 'success' && needs.worker_capture.outputs.recovery_mode != 'delivery_retry_only' && needs.worker_capture.outputs.recovery_mode != 'delivery_complete' }}
    permissions:
      contents: read
      issues: none
      pull-requests: none
    runs-on: ubuntu-latest
    outputs:
      candidate_patch_sha256: ${{ steps.restore.outputs.patch_sha256 }}
      candidate_tree_oid: ${{ steps.restore.outputs.tree_oid }}
      contract_fingerprint: ${{ steps.restore.outputs.contract_fingerprint }}
      verification_artifact_name: ${{ steps.verify_meta.outputs.artifact_name }}
      terminal_status: ${{ steps.verify_meta.outputs.terminal_status }}

    steps:
      - name: Checkout exact Candidate base
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.worker_capture.outputs.candidate_base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download immutable Candidate
        id: candidate_download
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.worker_capture.outputs.candidate_artifact_name }}
          path: ${{ runner.temp }}/mira-verify/candidate

      - name: Load trusted Candidate restore primitive
        id: candidate_tool
        shell: bash
        env:
          PATH: /usr/bin:/bin
          BASH_ENV: ''
          ENV: ''
          PYTHONPATH: ''
          PYTHONHOME: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/mira-verify"
          mkdir -p "$root"
          /usr/bin/curl -fsSL --retry 2 --proto '=https' --tlsv1.2 \
            "https://raw.githubusercontent.com/uichat-mira/.github/c5d93e149765f9068f3d342d2aed3a40a8f20efc/.github/scripts/worker-candidate/candidate.py" \
            -o "$root/trusted-candidate.py"
          test -s "$root/trusted-candidate.py"

      - name: Restore exact Candidate in clean Runner
        id: restore
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_ISSUE_NUMBER: ${{ inputs.issue_number }}
          EXPECTED_BASE_SHA: ${{ needs.worker_capture.outputs.candidate_base_sha }}
          EXPECTED_CONTRACT_FINGERPRINT: ${{ needs.worker_capture.outputs.contract_fingerprint }}
          EXPECTED_PATCH_SHA256: ${{ needs.worker_capture.outputs.candidate_patch_sha256 }}
          EXPECTED_TREE_OID: ${{ needs.worker_capture.outputs.candidate_tree_oid }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/mira-verify"
          candidate_dir="$root/candidate"

          python3 "$root/trusted-candidate.py" restore \
            --repo "$GITHUB_WORKSPACE" \
            --candidate-dir "$candidate_dir" \
            --expected-repository "$EXPECTED_REPOSITORY" \
            --expected-issue-number "$EXPECTED_ISSUE_NUMBER" \
            --expected-base-sha "$EXPECTED_BASE_SHA" \
            --expected-contract-fingerprint "$EXPECTED_CONTRACT_FINGERPRINT" \
            | tee "$root/restore-result.json"

          patch_sha256="$(jq -r '.candidate_patch_sha256' "$candidate_dir/candidate.json")"
          tree_oid="$(jq -r '.candidate_tree_oid' "$candidate_dir/candidate.json")"
          contract_fingerprint="$(jq -r '.contract_fingerprint' "$candidate_dir/candidate.json")"
          actual_tree_oid="$(git write-tree)"

          test "$patch_sha256" = "$EXPECTED_PATCH_SHA256"
          test "$tree_oid" = "$EXPECTED_TREE_OID"
          test "$actual_tree_oid" = "$EXPECTED_TREE_OID"
          test "$contract_fingerprint" = "$EXPECTED_CONTRACT_FINGERPRINT"

          {
            echo "patch_sha256=$patch_sha256"
            echo "tree_oid=$tree_oid"
            echo "contract_fingerprint=$contract_fingerprint"
          } >> "$GITHUB_OUTPUT"

      - name: Check restored Candidate diff
        id: diff_check
        if: ${{ steps.restore.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

      - name: Run trusted repository verification
        id: verify_command
        if: ${{ steps.restore.outcome == 'success' && steps.diff_check.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          MIRA_VERIFICATION_COMMAND: ${{ inputs.verification_command }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/mira-verify"
          test -n "${MIRA_VERIFICATION_COMMAND}"

          set +e
          {
            echo "$ ${MIRA_VERIFICATION_COMMAND}"
            bash -lc "${MIRA_VERIFICATION_COMMAND}"
          } 2>&1 | tee "$root/verification.raw"
          verification_rc="${PIPESTATUS[0]}"
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import json, os
          root = Path(os.environ["RUNNER_TEMP"]) / "mira-verify"
          src = root / "verification.raw"
          dst = root / "verification.log"
          limit = 120_000
          data = src.read_bytes() if src.exists() else b""
          truncated = len(data) > limit
          dst.write_bytes(data[:limit] + (b"\n[truncated]\n" if truncated else b""))
          (root / "verification-meta.json").write_text(json.dumps({"bytes": len(data), "limit_bytes": limit, "truncated": truncated}) + "\n")
          PY

          exit "$verification_rc"

      - name: Finalize Verify evidence
        id: verify_meta
        if: always()
        shell: bash
        env:
          BASE_SHA: ${{ needs.worker_capture.outputs.candidate_base_sha }}
          EXPECTED_PATCH_SHA256: ${{ needs.worker_capture.outputs.candidate_patch_sha256 }}
          EXPECTED_TREE_OID: ${{ needs.worker_capture.outputs.candidate_tree_oid }}
          EXPECTED_CONTRACT_FINGERPRINT: ${{ needs.worker_capture.outputs.contract_fingerprint }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          DIFF_CHECK_OUTCOME: ${{ steps.diff_check.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_command.outcome }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/mira-verify"
          mkdir -p "$root"
          artifact_name="mira-external-worker-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          export ARTIFACT_NAME="$artifact_name"

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          ok = os.getenv("RESTORE_OUTCOME") == "success" and os.getenv("DIFF_CHECK_OUTCOME") == "success" and os.getenv("VERIFY_OUTCOME") == "success"
          print("terminal_status=" + ("success" if ok else "failure"), file=open(os.environ["GITHUB_OUTPUT"], "a"))
          payload = {
              "schema_version": 1,
              "job_role": "verify",
              "repository": os.getenv("GITHUB_REPOSITORY"),
              "run_id": os.getenv("GITHUB_RUN_ID"),
              "run_attempt": os.getenv("GITHUB_RUN_ATTEMPT"),
              "base_sha": os.getenv("BASE_SHA"),
              "candidate_patch_sha256": os.getenv("EXPECTED_PATCH_SHA256"),
              "candidate_tree_oid": os.getenv("EXPECTED_TREE_OID"),
              "contract_fingerprint": os.getenv("EXPECTED_CONTRACT_FINGERPRINT"),
              "stages": {
                  "restore": os.getenv("RESTORE_OUTCOME"),
                  "diff_check": os.getenv("DIFF_CHECK_OUTCOME"),
                  "trusted_verification": os.getenv("VERIFY_OUTCOME"),
              },
              "terminal_status": "success" if ok else "failure",
              "verification_artifact": os.getenv("ARTIFACT_NAME"),
              "github_permissions": {"actions": "none", "contents": "read", "issues": "none", "pull_requests": "none"},
              "provider_credentials_present": False,
              "github_mutation_authority": False,
          }
          root = Path(os.environ["RUNNER_TEMP"]) / "mira-verify"
          (root / "verify-run.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY

      - name: Upload Verify evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.verify_meta.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/mira-verify/verify-run.json
            ${{ runner.temp }}/mira-verify/restore-result.json
            ${{ runner.temp }}/mira-verify/verification.log
            ${{ runner.temp }}/mira-verify/verification-meta.json
          if-no-files-found: warn
          retention-days: 14

      - name: Require verified Candidate
        if: always()
        shell: bash
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          DIFF_CHECK_OUTCOME: ${{ steps.diff_check.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_command.outcome }}
        run: |
          set -euo pipefail
          test "$RESTORE_OUTCOME" = "success"
          test "$DIFF_CHECK_OUTCOME" = "success"
          test "$VERIFY_OUTCOME" = "success"

  delivery:
    needs:
      - worker_capture
      - verify
    if: ${{ always() && needs.worker_capture.result == 'success' && needs.worker_capture.outputs.recovery_mode != 'delivery_complete' && ((needs.verify.result == 'success' && needs.worker_capture.outputs.recovery_mode != 'delivery_retry_only') || needs.worker_capture.outputs.recovery_mode == 'delivery_retry_only') }}
    permissions:
      contents: write
      issues: none
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      pull_request_url: ${{ steps.pr.outputs.url }}
      delivery_artifact_name: ${{ steps.delivery_evidence.outputs.artifact_name }}
      terminal_status: ${{ steps.delivery_evidence.outputs.terminal_status }}

    steps:
      - name: Resolve verified Delivery handoff
        id: verified_handoff
        shell: bash
        env:
          RECOVERY_MODE: ${{ needs.worker_capture.outputs.recovery_mode }}
          NORMAL_VERIFY_ARTIFACT: ${{ needs.verify.outputs.verification_artifact_name }}
          NORMAL_PATCH: ${{ needs.verify.outputs.candidate_patch_sha256 }}
          NORMAL_TREE: ${{ needs.verify.outputs.candidate_tree_oid }}
          NORMAL_CONTRACT: ${{ needs.verify.outputs.contract_fingerprint }}
          RECOVERED_VERIFY_ARTIFACT: ${{ needs.worker_capture.outputs.verification_artifact_name }}
          RECOVERED_PATCH: ${{ needs.worker_capture.outputs.verified_patch_sha256 }}
          RECOVERED_TREE: ${{ needs.worker_capture.outputs.verified_tree_oid }}
          RECOVERED_CONTRACT: ${{ needs.worker_capture.outputs.verified_contract_fingerprint }}
        run: |
          set -euo pipefail
          if test "$RECOVERY_MODE" = "delivery_retry_only"; then
            artifact="$RECOVERED_VERIFY_ARTIFACT"
            patch="$RECOVERED_PATCH"
            tree="$RECOVERED_TREE"
            contract="$RECOVERED_CONTRACT"
          else
            artifact="$NORMAL_VERIFY_ARTIFACT"
            patch="$NORMAL_PATCH"
            tree="$NORMAL_TREE"
            contract="$NORMAL_CONTRACT"
          fi
          test -n "$artifact"
          test -n "$patch"
          test -n "$tree"
          test -n "$contract"
          {
            echo "verification_artifact_name=$artifact"
            echo "candidate_patch_sha256=$patch"
            echo "candidate_tree_oid=$tree"
            echo "contract_fingerprint=$contract"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact verified Candidate base
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.worker_capture.outputs.candidate_base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download immutable Candidate
        id: candidate_download
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.worker_capture.outputs.candidate_artifact_name }}
          path: ${{ runner.temp }}/mira-delivery/candidate

      - name: Download Worker/Capture handoff
        id: worker_handoff
        uses: actions/download-artifact@v4
        with:
          name: mira-external-worker-${{ github.run_id }}
          path: ${{ runner.temp }}/mira-delivery/worker

      - name: Download Verify evidence
        id: verify_handoff
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.verified_handoff.outputs.verification_artifact_name }}
          path: ${{ runner.temp }}/mira-delivery/verify

      - name: Load trusted Candidate restore primitive
        id: candidate_tool
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/mira-delivery"
          /usr/bin/curl -fsSL --retry 2 --proto '=https' --tlsv1.2 \
            "https://raw.githubusercontent.com/uichat-mira/.github/c5d93e149765f9068f3d342d2aed3a40a8f20efc/.github/scripts/worker-candidate/candidate.py" \
            -o "$root/trusted-candidate.py"
          test -s "$root/trusted-candidate.py"

      - name: Restore exact verified Candidate
        id: restore
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_ISSUE_NUMBER: ${{ inputs.issue_number }}
          EXPECTED_BASE_SHA: ${{ needs.worker_capture.outputs.candidate_base_sha }}
          EXPECTED_CONTRACT_FINGERPRINT: ${{ needs.worker_capture.outputs.contract_fingerprint }}
          WORKER_BRANCH: ${{ needs.worker_capture.outputs.worker_branch }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/mira-delivery"
          git switch -c "$WORKER_BRANCH"

          python3 "$root/trusted-candidate.py" restore \
            --repo "$GITHUB_WORKSPACE" \
            --candidate-dir "$root/candidate" \
            --expected-repository "$EXPECTED_REPOSITORY" \
            --expected-issue-number "$EXPECTED_ISSUE_NUMBER" \
            --expected-base-sha "$EXPECTED_BASE_SHA" \
            --expected-contract-fingerprint "$EXPECTED_CONTRACT_FINGERPRINT" \
            | tee "$root/restore-result.json"

      - name: Assert verified Candidate identity
        id: identity
        shell: bash
        env:
          WORKER_PATCH_SHA256: ${{ needs.worker_capture.outputs.candidate_patch_sha256 }}
          WORKER_TREE_OID: ${{ needs.worker_capture.outputs.candidate_tree_oid }}
          VERIFY_PATCH_SHA256: ${{ steps.verified_handoff.outputs.candidate_patch_sha256 }}
          VERIFY_TREE_OID: ${{ steps.verified_handoff.outputs.candidate_tree_oid }}
          VERIFY_CONTRACT_FINGERPRINT: ${{ steps.verified_handoff.outputs.contract_fingerprint }}
          EXPECTED_CONTRACT_FINGERPRINT: ${{ needs.worker_capture.outputs.contract_fingerprint }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/mira-delivery"
          manifest="$root/candidate/candidate.json"
          verify_run="$root/verify/verify-run.json"

          manifest_patch="$(jq -r '.candidate_patch_sha256' "$manifest")"
          manifest_tree="$(jq -r '.candidate_tree_oid' "$manifest")"
          manifest_contract="$(jq -r '.contract_fingerprint' "$manifest")"
          restored_tree="$(git write-tree)"
          verify_status="$(jq -r '.terminal_status' "$verify_run")"
          verify_evidence_patch="$(jq -r '.candidate_patch_sha256' "$verify_run")"
          verify_evidence_tree="$(jq -r '.candidate_tree_oid' "$verify_run")"

          test "$verify_status" = "success"
          test "$manifest_patch" = "$WORKER_PATCH_SHA256"
          test "$manifest_patch" = "$VERIFY_PATCH_SHA256"
          test "$manifest_patch" = "$verify_evidence_patch"
          test "$manifest_tree" = "$WORKER_TREE_OID"
          test "$manifest_tree" = "$VERIFY_TREE_OID"
          test "$manifest_tree" = "$verify_evidence_tree"
          test "$restored_tree" = "$manifest_tree"
          test "$manifest_contract" = "$EXPECTED_CONTRACT_FINGERPRINT"
          test "$manifest_contract" = "$VERIFY_CONTRACT_FINGERPRINT"

          {
            echo "patch_sha256=$manifest_patch"
            echo "tree_oid=$manifest_tree"
          } >> "$GITHUB_OUTPUT"

      - name: Load trusted idempotent Delivery primitive
        id: delivery_tool
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/mira-delivery"
          mkdir -p "$root"
          /usr/bin/curl -fsSL --retry 2 --proto '=https' --tlsv1.2 \
            "https://raw.githubusercontent.com/uichat-mira/.github/043f21fbe3f57d63cc388390a35d813d912c7c1c/.github/scripts/worker-candidate/delivery.py" \
            -o "$root/trusted-delivery.py"
          test -s "$root/trusted-delivery.py"

      - name: Commit/push or reuse exact verified Candidate branch
        id: commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          WORKER_BRANCH: ${{ needs.worker_capture.outputs.worker_branch }}
          EXPECTED_BASE_SHA: ${{ needs.worker_capture.outputs.candidate_base_sha }}
          EXPECTED_TREE_OID: ${{ steps.verified_handoff.outputs.candidate_tree_oid }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/mira-delivery"
          git config user.name "mira-agent-worker[bot]"
          git config user.email "mira-agent-worker[bot]@users.noreply.github.com"
          gh auth setup-git

          python3 "$root/trusted-delivery.py" ensure-branch \
            --repo "$GITHUB_WORKSPACE" \
            --branch "$WORKER_BRANCH" \
            --base-sha "$EXPECTED_BASE_SHA" \
            --tree-oid "$EXPECTED_TREE_OID" \
            --commit-message "agent: implement issue #${ISSUE_NUMBER}" \
            > "$root/delivery-branch.json"

          commit_sha="$(jq -r '.commit_sha' "$root/delivery-branch.json")"
          commit_tree_oid="$(jq -r '.commit_tree_oid' "$root/delivery-branch.json")"
          test "$commit_tree_oid" = "$EXPECTED_TREE_OID"
          {
            echo "commit_sha=$commit_sha"
            echo "commit_tree_oid=$commit_tree_oid"
          } >> "$GITHUB_OUTPUT"

      - name: Create Draft PR with durable handoff
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          BASE_SHA: ${{ needs.worker_capture.outputs.candidate_base_sha }}
          WORKER_BRANCH: ${{ needs.worker_capture.outputs.worker_branch }}
          PROVIDER: ${{ needs.worker_capture.outputs.provider }}
          PROVIDER_PROFILE: ${{ needs.worker_capture.outputs.provider_profile }}
          PROVIDER_REGISTRY_REF: ${{ needs.worker_capture.outputs.provider_registry_ref }}
          MODEL_ROUTE: ${{ needs.worker_capture.outputs.model_route }}
          OPENCODE_VERSION: ${{ inputs.free_mode && '2.0.24' || '1.18.34' }}
          VERIFICATION_COMMAND: ${{ inputs.verification_command }}
          CANDIDATE_PATCH_SHA256: ${{ steps.verified_handoff.outputs.candidate_patch_sha256 }}
          CANDIDATE_TREE_OID: ${{ steps.verified_handoff.outputs.candidate_tree_oid }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/mira-delivery"
          export ISSUE_TITLE
          ISSUE_TITLE="$(jq -r '.title' "$root/worker/issue.json" | cut -c1-220)"

          python3 <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "mira-delivery"
          worker_path = root / "worker" / "worker-output.txt"
          verify_path = root / "verify" / "verification.log"
          worker_output = worker_path.read_text(errors="replace")[:12000] if worker_path.exists() else "(Delivery-only retry: model was not rerun.)"
          verification_output = verify_path.read_text(errors="replace")[:12000] if verify_path.exists() else "(Prior trusted Verify evidence reused.)"

          body = f"""## Mira external Worker handoff

          - Work item: #{os.environ["ISSUE_NUMBER"]} — {os.environ["ISSUE_TITLE"]}
          - Delivery base: `{os.environ["BASE_BRANCH"]}`
          - Base SHA: `{os.environ["BASE_SHA"]}`
          - Worker branch: `{os.environ["WORKER_BRANCH"]}`
          - Worker harness: OpenCode CLI {os.environ["OPENCODE_VERSION"]}
          - Provider: `{os.environ["PROVIDER"]}`
          - Provider profile: `{os.environ["PROVIDER_PROFILE"] or "builtin"}`
          - Provider registry revision: `{os.environ["PROVIDER_REGISTRY_REF"]}`
          - Model route: `{os.environ["MODEL_ROUTE"]}`
          - Candidate patch: `{os.environ["CANDIDATE_PATCH_SHA256"]}`
          - Candidate tree: `{os.environ["CANDIDATE_TREE_OID"]}`
          - Verification: PASS (clean Runner)
          - Verification command: `{os.environ["VERIFICATION_COMMAND"]}`

          This PR is intentionally **Draft**. Worker execution and Delivery do not grant merge, Issue acceptance/closure, environment promotion, release, or deployment authority.

          <details>
          <summary>Worker handoff</summary>

          <pre>
          {worker_output}
          </pre>
          </details>

          <details>
          <summary>Clean-room verification output</summary>

          <pre>
          {verification_output}
          </pre>
          </details>
          """
          (root / "pr-body.md").write_text(body)
          PY

          python3 "$root/trusted-delivery.py" ensure-pr \
            --branch "$WORKER_BRANCH" \
            --head-owner "$GITHUB_REPOSITORY_OWNER" \
            --base "$BASE_BRANCH" \
            --head-sha "${{ steps.commit.outputs.commit_sha }}" \
            --title "agent: #${ISSUE_NUMBER} ${ISSUE_TITLE}" \
            --body-file "$root/pr-body.md" \
            > "$root/pr-resolution.json"
          pr_url="$(jq -r '.url' "$root/pr-resolution.json")"
          test -n "$pr_url"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Verify Draft PR and exact Candidate delivery boundary
        id: boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          WORKER_BRANCH: ${{ needs.worker_capture.outputs.worker_branch }}
          EXPECTED_TREE_OID: ${{ steps.verified_handoff.outputs.candidate_tree_oid }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
        run: |
          set -euo pipefail
          pr_json="$(gh pr view "$PR_URL" --json isDraft,baseRefName,headRefName,state,headRefOid)"
          test "$(jq -r '.isDraft' <<< "$pr_json")" = "true"
          test "$(jq -r '.baseRefName' <<< "$pr_json")" = "$BASE_BRANCH"
          test "$(jq -r '.headRefName' <<< "$pr_json")" = "$WORKER_BRANCH"
          test "$(jq -r '.state' <<< "$pr_json")" = "OPEN"
          test "$(jq -r '.headRefOid' <<< "$pr_json")" = "$COMMIT_SHA"
          test "$(git show -s --format=%T "$COMMIT_SHA")" = "$EXPECTED_TREE_OID"

      - name: Finalize Delivery evidence
        id: delivery_evidence
        if: always()
        shell: bash
        env:
          BASE_SHA: ${{ needs.worker_capture.outputs.candidate_base_sha }}
          WORKER_BRANCH: ${{ needs.worker_capture.outputs.worker_branch }}
          CANDIDATE_PATCH_SHA256: ${{ steps.verified_handoff.outputs.candidate_patch_sha256 }}
          CANDIDATE_TREE_OID: ${{ steps.verified_handoff.outputs.candidate_tree_oid }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          PR_OUTCOME: ${{ steps.pr.outcome }}
          BOUNDARY_OUTCOME: ${{ steps.boundary.outcome }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/mira-delivery"
          mkdir -p "$root"
          artifact_name="mira-external-worker-delivery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

          python3 - <<'PY'
          import json, os
          from pathlib import Path

          stages = {
              "restore": os.getenv("RESTORE_OUTCOME"),
              "verified_identity": os.getenv("IDENTITY_OUTCOME"),
              "commit_push": os.getenv("COMMIT_OUTCOME"),
              "draft_pr": os.getenv("PR_OUTCOME"),
              "draft_pr_boundary": os.getenv("BOUNDARY_OUTCOME"),
          }
          failed = next((k for k, v in stages.items() if v == "failure"), None)
          ok = not failed and all(v in {"success", "skipped"} for v in stages.values())
          print("terminal_status=" + ("success" if ok else "failure"), file=open(os.environ["GITHUB_OUTPUT"], "a"))
          payload = {
              "schema_version": 1,
              "job_role": "delivery",
              "repository": os.getenv("GITHUB_REPOSITORY"),
              "run_id": os.getenv("GITHUB_RUN_ID"),
              "run_attempt": os.getenv("GITHUB_RUN_ATTEMPT"),
              "base_sha": os.getenv("BASE_SHA"),
              "worker_branch": os.getenv("WORKER_BRANCH"),
              "candidate_patch_sha256": os.getenv("CANDIDATE_PATCH_SHA256"),
              "candidate_tree_oid": os.getenv("CANDIDATE_TREE_OID"),
              "stages": stages,
              "terminal_status": "success" if ok else "failure",
              "failure_stage": failed or "none",
              "commit_sha": os.getenv("COMMIT_SHA") or None,
              "draft_pr_url": os.getenv("PR_URL") or None,
              "github_permissions": {"actions": "none", "contents": "write", "issues": "none", "pull_requests": "write"},
              "provider_credentials_present": False,
              "authority": {
                  "push_worker_branch": True,
                  "create_draft_pr": True,
                  "merge": False,
                  "issue_outcome": False,
                  "release": False,
                  "deploy": False,
              },
          }
          root = Path(os.environ["RUNNER_TEMP"]) / "mira-delivery"
          (root / "delivery-run.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY

      - name: Upload Delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.delivery_evidence.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/mira-delivery/delivery-run.json
            ${{ runner.temp }}/mira-delivery/restore-result.json
          if-no-files-found: warn
          retention-days: 14


  recovery_index:
    needs:
      - worker_capture
      - verify
      - delivery
    if: ${{ always() && needs.worker_capture.outputs.recovery_mode != 'delivery_complete' && needs.worker_capture.outputs.candidate_artifact_name != '' && needs.worker_capture.outputs.candidate_artifact_id != '' && (needs.worker_capture.outputs.recovery_mode != 'delivery_retry_only' || (needs.worker_capture.outputs.recovered_candidate_upload_outcome == 'success' && needs.worker_capture.outputs.recovered_verify_upload_outcome == 'success')) }}
    permissions:
      contents: none
      issues: write
      pull-requests: none
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Publish durable Recovery pointer to owning Issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          RECOVERY_MODE: ${{ needs.worker_capture.outputs.recovery_mode }}
          RECOVERY_SOURCE_RUN_ID: ${{ needs.worker_capture.outputs.recovery_source_run_id }}
          BASE_SHA: ${{ needs.worker_capture.outputs.candidate_base_sha }}
          BASE_BRANCH: ${{ needs.worker_capture.outputs.candidate_base_branch }}
          WORKER_BRANCH: ${{ needs.worker_capture.outputs.worker_branch }}
          CANDIDATE_ORIGIN_RUN_ID: ${{ needs.worker_capture.outputs.candidate_origin_run_id }}
          CANDIDATE_ORIGIN_RUN_ATTEMPT: ${{ needs.worker_capture.outputs.candidate_origin_run_attempt }}
          CANDIDATE_ARTIFACT_NAME: ${{ needs.worker_capture.outputs.candidate_artifact_name }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.worker_capture.outputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.worker_capture.outputs.candidate_artifact_digest }}
          CANDIDATE_PATCH_SHA256: ${{ needs.worker_capture.outputs.candidate_patch_sha256 }}
          CANDIDATE_TREE_OID: ${{ needs.worker_capture.outputs.candidate_tree_oid }}
          CONTRACT_FINGERPRINT: ${{ needs.worker_capture.outputs.contract_fingerprint }}
          AMBIGUITY_GUARD: ${{ needs.worker_capture.outputs.ambiguity_guard }}
          PROVIDER: ${{ needs.worker_capture.outputs.provider }}
          PROVIDER_PROFILE: ${{ needs.worker_capture.outputs.provider_profile }}
          PROVIDER_REGISTRY_REF: ${{ needs.worker_capture.outputs.provider_registry_ref }}
          MODEL_ROUTE: ${{ needs.worker_capture.outputs.model_route }}
          MODEL: ${{ needs.worker_capture.outputs.model }}
          NORMAL_VERIFY_RESULT: ${{ needs.verify.outputs.terminal_status }}
          NORMAL_VERIFY_JOB_RESULT: ${{ needs.verify.result }}
          NORMAL_VERIFY_ARTIFACT: ${{ needs.verify.outputs.verification_artifact_name }}
          RECOVERED_VERIFY_ARTIFACT: ${{ needs.worker_capture.outputs.verification_artifact_name }}
          DELIVERY_RESULT: ${{ needs.delivery.outputs.terminal_status }}
          DELIVERY_JOB_RESULT: ${{ needs.delivery.result }}
          DELIVERY_ARTIFACT: ${{ needs.delivery.outputs.delivery_artifact_name }}
          DRAFT_PR_URL: ${{ needs.delivery.outputs.pull_request_url }}
        run: |
          set -euo pipefail

          if test "$RECOVERY_MODE" = "delivery_retry_only"; then
            verify_state="success"
            verify_artifact="$RECOVERED_VERIFY_ARTIFACT"
          else
            if test "${NORMAL_VERIFY_RESULT:-}" = "success" || test "${NORMAL_VERIFY_RESULT:-}" = "failure"; then
              verify_state="$NORMAL_VERIFY_RESULT"
            elif test "$NORMAL_VERIFY_JOB_RESULT" = "skipped"; then
              verify_state="skipped"
            else
              verify_state="failure"
            fi
            verify_artifact="${NORMAL_VERIFY_ARTIFACT:-}"
          fi

          if test "${DELIVERY_RESULT:-}" = "success" || test "${DELIVERY_RESULT:-}" = "failure"; then
            delivery_state="$DELIVERY_RESULT"
          elif test "$DELIVERY_JOB_RESULT" = "skipped"; then
            delivery_state="skipped"
          else
            delivery_state="failure"
          fi

          export POINTER_JSON
          POINTER_JSON="$(jq -cn \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson issue "$ISSUE_NUMBER" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg recovery_mode "$RECOVERY_MODE" \
            --arg recovery_source_run_id "$RECOVERY_SOURCE_RUN_ID" \
            --arg base_sha "$BASE_SHA" \
            --arg base_branch "$BASE_BRANCH" \
            --arg worker_branch "$WORKER_BRANCH" \
            --arg candidate_origin_run_id "$CANDIDATE_ORIGIN_RUN_ID" \
            --arg candidate_origin_run_attempt "$CANDIDATE_ORIGIN_RUN_ATTEMPT" \
            --arg candidate_artifact_name "$CANDIDATE_ARTIFACT_NAME" \
            --arg candidate_artifact_id "$CANDIDATE_ARTIFACT_ID" \
            --arg candidate_artifact_digest "$CANDIDATE_ARTIFACT_DIGEST" \
            --arg candidate_patch_sha256 "$CANDIDATE_PATCH_SHA256" \
            --arg candidate_tree_oid "$CANDIDATE_TREE_OID" \
            --arg contract_fingerprint "$CONTRACT_FINGERPRINT" \
            --arg ambiguity_guard "$AMBIGUITY_GUARD" \
            --arg provider "$PROVIDER" \
            --arg provider_profile "$PROVIDER_PROFILE" \
            --arg provider_registry_ref "$PROVIDER_REGISTRY_REF" \
            --arg model_route "$MODEL_ROUTE" \
            --arg model "$MODEL" \
            --arg verification_state "$verify_state" \
            --arg verification_artifact_name "$verify_artifact" \
            --arg delivery_state "$delivery_state" \
            --arg delivery_artifact_name "$DELIVERY_ARTIFACT" \
            --arg draft_pr_url "$DRAFT_PR_URL" \
            '{
              schema_version: 1,
              repository: $repository,
              issue_number: $issue,
              run_id: ($run_id | tonumber),
              run_attempt: ($run_attempt | tonumber),
              recovery_mode: $recovery_mode,
              recovery_source_run_id: (if $recovery_source_run_id == "" then null else ($recovery_source_run_id | tonumber) end),
              base_sha: $base_sha,
              base_branch: $base_branch,
              worker_branch: $worker_branch,
              candidate_origin_run_id: ($candidate_origin_run_id | tonumber),
              candidate_origin_run_attempt: ($candidate_origin_run_attempt | tonumber),
              candidate_artifact_name: $candidate_artifact_name,
              candidate_artifact_id: $candidate_artifact_id,
              candidate_artifact_digest: $candidate_artifact_digest,
              candidate_patch_sha256: $candidate_patch_sha256,
              candidate_tree_oid: $candidate_tree_oid,
              contract_fingerprint: $contract_fingerprint,
              ambiguity_guard: $ambiguity_guard,
              provider: $provider,
              provider_profile: $provider_profile,
              provider_registry_ref: $provider_registry_ref,
              model_route: $model_route,
              model: $model,
              verification_state: $verification_state,
              verification_artifact_name: $verification_artifact_name,
              delivery_state: $delivery_state,
              delivery_artifact_name: $delivery_artifact_name,
              draft_pr_url: $draft_pr_url
            }')"

          body="$(cat <<EOF
          <!-- mira-recovery-candidate:v1
          $POINTER_JSON
          -->
          Mira Worker Recovery pointer · run $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT · Candidate `$CANDIDATE_TREE_OID` · Verify $verify_state · Delivery $delivery_state.
          EOF
          )"

          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --method POST \
            -f body="$body" \
            >/dev/null
