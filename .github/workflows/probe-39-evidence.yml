name: Probe Worker 39 Evidence

on:
  push:
    branches:
      - feat/39-worker-evidence
    paths:
      - .github/workflows/probe-39-evidence.yml

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  worker:
    uses: uichat-mira/.github/.github/workflows/mira-external-worker.yml@327ae26ade7be83169b213e5cdcb3b91020b90bf
    with:
      issue_number: 39
      base_branch: feat/39-worker-evidence
      verification_command: |
        git diff --check
    secrets:
      opencode_go_api_key: ${{ secrets.AI_PROVIDER_OPENCODE_GO_KEY }}
