name: Reconcile AI Review follow-ups once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-ai-review-followups-once.yml'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ORG_GITHUB_TOKEN }}
      ORG: uichat-mira
      PROJECT_NUMBER: '1'
      API_VERSION: '2026-03-10'
    steps:
      - name: Add follow-up cards and set stages
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo '::error::ORG_GITHUB_TOKEN is unavailable.'
            exit 1
          fi

          stage_field_id="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H "X-GitHub-Api-Version: ${API_VERSION}" \
            "/orgs/${ORG}/issue-fields" \
            --jq '.[] | select(.name == "Stage") | .id' | head -n 1)"

          if [ -z "${stage_field_id:-}" ]; then
            echo '::error::Organization Stage Issue Field not found.'
            exit 1
          fi

          project_urls="$(mktemp)"
          gh project item-list "$PROJECT_NUMBER" \
            --owner "$ORG" \
            --limit 1000 \
            --format json \
            --jq '.items[].content.url // empty' \
            | sort -u > "$project_urls"

          ensure_project_and_stage() {
            local repo="$1"
            local issue="$2"
            local stage="$3"
            local issue_url="https://github.com/${ORG}/${repo}/issues/${issue}"
            local issue_id
            local payload

            issue_id="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H "X-GitHub-Api-Version: ${API_VERSION}" \
              "/repos/${ORG}/${repo}/issues/${issue}" \
              --jq '.id')"

            if ! grep -Fxq "$issue_url" "$project_urls"; then
              echo "Adding ${issue_url} to Mira Development"
              gh api \
                --method POST \
                -H 'Accept: application/vnd.github+json' \
                -H "X-GitHub-Api-Version: ${API_VERSION}" \
                "/orgs/${ORG}/projectsV2/${PROJECT_NUMBER}/items" \
                -f type='Issue' \
                -F id="$issue_id" >/dev/null
              echo "$issue_url" >> "$project_urls"
            fi

            payload="$(jq -nc \
              --argjson field_id "$stage_field_id" \
              --arg value "$stage" \
              '{issue_field_values:[{field_id:$field_id,value:$value}]}')"

            gh api \
              --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H "X-GitHub-Api-Version: ${API_VERSION}" \
              "/repos/${ORG}/${repo}/issues/${issue}/issue-field-values" \
              --input - <<<"$payload" >/dev/null

            echo "${ORG}/${repo}#${issue} -> ${stage}"
          }

          ensure_project_and_stage 'control-room' 14 'Done'
          ensure_project_and_stage 'control-room' 15 'Ready'
