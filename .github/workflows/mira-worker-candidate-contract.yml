name: Mira Worker Candidate Contract

on:
  pull_request:
    paths:
      - '.github/scripts/worker-candidate/**'
      - '.github/workflows/mira-worker-candidate-contract.yml'
      - '.github/workflows/mira-external-worker.yml'
      - 'docs/governance/external-worker-candidate.md'
      - 'docs/governance/external-worker-evidence.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Candidate tools
        run: |
          python3 -m py_compile \
            .github/scripts/worker-candidate/candidate.py \
            .github/scripts/worker-candidate/fixture.py

      - name: Run Candidate round-trip and failure fixtures
        run: python3 .github/scripts/worker-candidate/fixture.py

      - name: Assert production Candidate stage ordering and fail-closed states
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/mira-external-worker.yml").read_text()
          capture = workflow.index("      - name: Capture durable Candidate")
          upload = workflow.index("      - name: Upload durable Candidate")
          bounded = workflow.index("      - name: Require a bounded implementation change")
          verify = workflow.index("      - name: Run trusted repository verification")
          assert capture < upload < bounded < verify
          assert "steps.worker.outcome != 'skipped'" in workflow
          assert "candidate_tool_commit=c5d93e149765f9068f3d342d2aed3a40a8f20efc" in workflow
          assert '"state": "unavailable"' in workflow
          assert '"reason": "no_changes"' in workflow
          assert '"state": "rejected" if rc == 2 else "capture_failed"' in workflow
          assert 'candidate["state"] = "upload_failed"' in workflow
          assert 'candidate["recoverable"] = False' in workflow
          assert 'candidate["recoverable"] = True' in workflow
          PY

  durable-candidate-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create disposable Worker fixture repository
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/agt-057"
          repo="${root}/source"
          mkdir -p "$repo"
          git -C "$repo" init -q
          git -C "$repo" config user.name "Mira Candidate Fixture"
          git -C "$repo" config user.email "fixture@example.invalid"
          printf 'base\n' > "$repo/work.txt"
          git -C "$repo" add -A
          git -C "$repo" commit -qm base
          base_sha="$(git -C "$repo" rev-parse HEAD)"
          {
            echo "FIXTURE_ROOT=$root"
            echo "FIXTURE_REPO=$repo"
            echo "FIXTURE_BASE_SHA=$base_sha"
          } >> "$GITHUB_ENV"

      - name: Simulate Worker modification then provider failure
        id: worker_failure
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          printf 'worker-progress\n' > "${FIXTURE_REPO}/work.txt"
          printf 'new-file\n' > "${FIXTURE_REPO}/new.txt"
          exit 42

      - name: Capture Candidate after failed Worker step
        id: capture_after_failure
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/worker-candidate/candidate.py capture \
            --repo "$FIXTURE_REPO" \
            --output "${FIXTURE_ROOT}/candidate" \
            --repository "uichat-mira/candidate-fixture" \
            --issue-number 57 \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --base-branch main \
            --base-sha "$FIXTURE_BASE_SHA" \
            --contract-fingerprint "sha256:6cf6609e1a936e902e4209c5b3854a63d4943d809b64b1d08bf2ee84732fba12" \
            --worker-outcome failure \
            --provider fixture \
            --model fixture-model

      - name: Upload Candidate from failed Worker fixture
        id: failure_candidate_upload
        if: ${{ always() && steps.capture_after_failure.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: agt-057-failed-worker-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/agt-057/candidate/candidate.patch
            ${{ runner.temp }}/agt-057/candidate/candidate.json
          if-no-files-found: error
          retention-days: 14

      - name: Download uploaded failed-Worker Candidate
        uses: actions/download-artifact@v4
        with:
          name: agt-057-failed-worker-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/agt-057/downloaded-candidate

      - name: Simulate trusted verification failure after Candidate upload
        id: verification_failure
        continue-on-error: true
        shell: bash
        run: exit 17

      - name: Restore failed-Worker Candidate in clean checkout
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          restore="${FIXTURE_ROOT}/restore"
          git clone -q "$FIXTURE_REPO" "$restore"
          git -C "$restore" checkout -q "$FIXTURE_BASE_SHA"
          python3 .github/scripts/worker-candidate/candidate.py restore \
            --repo "$restore" \
            --candidate-dir "${FIXTURE_ROOT}/downloaded-candidate" \
            --expected-repository "uichat-mira/candidate-fixture" \
            --expected-issue-number 57 \
            --expected-base-sha "$FIXTURE_BASE_SHA" \
            --expected-contract-fingerprint "sha256:6cf6609e1a936e902e4209c5b3854a63d4943d809b64b1d08bf2ee84732fba12"
          test "$(cat "$restore/work.txt")" = "worker-progress"
          test "$(cat "$restore/new.txt")" = "new-file"

      - name: Simulate Candidate artifact upload failure
        id: upload_failure
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: agt-057-missing-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/agt-057/does-not-exist/**
          if-no-files-found: error
          retention-days: 14

      - name: Assert failure/recovery signals
        if: ${{ always() }}
        shell: bash
        env:
          WORKER_OUTCOME: ${{ steps.worker_failure.outcome }}
          CAPTURE_OUTCOME: ${{ steps.capture_after_failure.outcome }}
          UPLOAD_OUTCOME: ${{ steps.failure_candidate_upload.outcome }}
          UPLOAD_ID: ${{ steps.failure_candidate_upload.outputs.artifact-id }}
          UPLOAD_DIGEST: ${{ steps.failure_candidate_upload.outputs.artifact-digest }}
          VERIFY_OUTCOME: ${{ steps.verification_failure.outcome }}
          FAILED_UPLOAD_OUTCOME: ${{ steps.upload_failure.outcome }}
        run: |
          set -euo pipefail
          test "$WORKER_OUTCOME" = failure
          test "$CAPTURE_OUTCOME" = success
          test "$UPLOAD_OUTCOME" = success
          test -n "$UPLOAD_ID"
          test -n "$UPLOAD_DIGEST"
          test "$VERIFY_OUTCOME" = failure
          test "$FAILED_UPLOAD_OUTCOME" = failure
