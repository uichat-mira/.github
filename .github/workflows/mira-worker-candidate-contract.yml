name: Mira Worker Candidate Contract

on:
  pull_request:
    paths:
      - '.github/scripts/worker-candidate/**'
      - '.github/scripts/worker-repair/**'
      - '.github/scripts/worker-runtime/**'
      - '.github/workflows/mira-worker-candidate-contract.yml'
      - '.github/workflows/mira-external-worker.yml'
      - '.github/workflows/mira-external-worker-repair.yml'
      - 'docs/governance/external-worker-candidate.md'
      - 'docs/governance/external-worker-evidence.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Candidate tools
        run: |
          python3 -m py_compile \
            .github/scripts/worker-candidate/candidate.py \
            .github/scripts/worker-candidate/fixture.py \
            .github/scripts/worker-candidate/recovery.py \
            .github/scripts/worker-candidate/recovery_fixture.py \
            .github/scripts/worker-candidate/delivery.py \
            .github/scripts/worker-candidate/delivery_fixture.py

      - name: Run Candidate round-trip and rejection fixtures
        run: python3 .github/scripts/worker-candidate/fixture.py

      - name: Run Recovery contract fixtures
        run: python3 .github/scripts/worker-candidate/recovery_fixture.py

      - name: Run Delivery idempotency fixtures
        run: python3 .github/scripts/worker-candidate/delivery_fixture.py

      - name: Assert production repair topology, Recovery and permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/mira-external-worker.yml").read_text()
          repair = Path(".github/workflows/mira-external-worker-repair.yml").read_text()
          runtime = Path(".github/scripts/worker-runtime/run-worker.sh").read_text()

          worker_start = workflow.index("  worker_capture:")
          verify_start = workflow.index("\n  verify:", worker_start)
          decision_start = workflow.index("\n  initial_repair_outcome:", verify_start)
          repair1_start = workflow.index("\n  repair_round_1:", decision_start)
          repair2_start = workflow.index("\n  repair_round_2:", repair1_start)
          lifecycle_start = workflow.index("\n  lifecycle_handoff:", repair2_start)
          delivery_start = workflow.index("\n  delivery:", lifecycle_start)
          recovery_index_start = workflow.index("\n  recovery_index:", delivery_start)
          reporter_start = workflow.index("\n  trusted_reporter:", recovery_index_start)

          worker = workflow[worker_start:verify_start]
          verify = workflow[verify_start:decision_start]
          decision = workflow[decision_start:repair1_start]
          repair1 = workflow[repair1_start:repair2_start]
          repair2 = workflow[repair2_start:lifecycle_start]
          lifecycle = workflow[lifecycle_start:delivery_start]
          delivery = workflow[delivery_start:recovery_index_start]
          recovery_index = workflow[recovery_index_start:reporter_start]
          reporter = workflow[reporter_start:]

          assert "value: $" + "{{ jobs.worker_capture.outputs.worker_branch }}" in workflow
          assert "value: $" + "{{ jobs.delivery.outputs.pull_request_url || jobs.worker_capture.outputs.pull_request_url }}" in workflow

          assert "actions: read" in worker
          assert "contents: read" in worker
          assert "issues: read" in worker
          assert "pull-requests: none" in worker
          assert "contents: write" not in worker
          assert "pull-requests: write" not in worker
          assert "Discover and prepare Candidate Recovery" in worker
          assert "delivery_retry_only" in worker
          assert "candidate_artifact_unavailable_or_expired" in worker
          assert "base_advanced_clean_3way" in worker
          assert "base_advanced_3way_conflict" in worker
          assert "validation-contract.json" in worker
          assert "Enforce Validation dispatch contract before model execution" in worker
          assert worker.index("Enforce Validation dispatch contract before model execution") < worker.index("Resolve run-scoped Worker provider route")
          assert "Load trusted shared Worker runtime" in worker
          assert "trusted-worker-runtime.sh" in worker
          assert 'bash "${RUNNER_TEMP}/mira-worker/trusted-worker-runtime.sh"' in worker
          assert "trusted-repair.py" in worker
          assert "structured_repair_context_build_failed" in worker
          assert '--repair-round "$worker_repair_round"' in worker or '--repair-round "$REPAIR_ROUND"' in worker
          assert 'worker_repair_round="$source_repair_round"' in worker
          assert 'worker_repair_round="$(jq -r '.next_repair_round // ""'' in worker
          assert '--repair-round "$REPAIR_ROUND"' in worker
          assert "Capture durable Candidate" in worker
          assert "Commit/push or reuse exact verified Candidate branch" not in worker
          assert "opencode run" not in worker
          assert "opencode run" in runtime

          assert "needs: worker_capture" in verify
          assert "contents: read" in verify
          assert "issues: none" in verify
          assert "pull-requests: none" in verify
          assert "contents: write" not in verify
          assert "pull-requests: write" not in verify
          assert "secrets." not in verify
          assert "Checkout exact Candidate base" in verify
          assert "Restore exact Candidate in clean Runner" in verify
          assert "--expected-repair-round \"$EXPECTED_REPAIR_ROUND\"" in verify
          assert "Run trusted Validation ladder" in verify
          assert "validation-report.json" in verify
          assert '"repair_round": int(os.getenv("REPAIR_ROUND") or "0")' in verify
          assert "needs.worker_capture.outputs.candidate_repair_round" in verify
          assert "Require trustworthy Validation evidence" in verify
          assert "Require verified Candidate" not in verify

          assert '--completed-rounds "$COMPLETED_REPAIR_ROUNDS"' in decision
          assert "needs.worker_capture.outputs.candidate_repair_round" in decision
          assert "state == 'RETURNED'" in repair1
          assert "repair_round: $" + "{{ fromJSON(needs.initial_repair_outcome.outputs.next_repair_round) }}" in repair1
          assert "state == 'RETURNED'" in repair2
          assert "repair_round: $" + "{{ fromJSON(needs.repair_round_1.outputs.next_repair_round) }}" in repair2
          assert "repair_round_3:" not in workflow
          assert workflow.count("uses: ./.github/workflows/mira-external-worker-repair.yml") == 2

          assert "  repair_worker:" in repair
          assert "  verify:" in repair
          assert "  outcome:" in repair
          repair_worker_start = repair.index("  repair_worker:")
          repair_verify_start = repair.index("\n  verify:", repair_worker_start)
          repair_outcome_start = repair.index("\n  outcome:", repair_verify_start)
          repair_worker = repair[repair_worker_start:repair_verify_start]
          repair_verify = repair[repair_verify_start:repair_outcome_start]
          repair_outcome = repair[repair_outcome_start:]
          assert "Download source Candidate" in repair_worker
          assert "Download trusted Validation evidence" in repair_worker
          assert "Build bounded trusted repair context" in repair_worker
          assert "Run bounded repair Worker" in repair_worker
          assert "--repair-round \"$REPAIR_ROUND\"" in repair_worker
          assert "id: worker_handoff_upload" in repair_worker
          assert "WORKER_HANDOFF_UPLOAD_OUTCOME" in repair_worker
          assert "actions: read" in repair_worker
          assert "contents: read" in repair_worker
          assert "contents: write" not in repair_worker
          assert "pull-requests: write" not in repair_worker
          assert "Restore exact repaired Candidate" in repair_verify
          assert "--expected-repair-round \"$REPAIR_ROUND\"" in repair_verify
          assert "Run trusted Validation on repaired Candidate" in repair_verify
          assert "id: verify_upload" in repair_verify
          assert "id: require_evidence" in repair_verify
          assert "VERIFY_UPLOAD_OUTCOME" in repair_verify
          assert "evidence_status: ${{ steps.require_evidence.outputs.evidence_status }}" in repair_verify
          assert "provider_api_key" not in repair_verify
          assert "opencode_go_api_key" not in repair_verify
          assert "secrets." not in repair_verify
          assert "github_mutation_authority:false" in repair_verify
          assert '--completed-rounds "$REPAIR_ROUND"' in repair_outcome
          assert "worker_failure" in repair_outcome
          assert "verify_infrastructure" in repair_outcome

          assert "Select current Candidate generation exactly once" in lifecycle
          assert "A failed repair attempt must never erase the last durable Candidate" in lifecycle
          assert 'case "$state" in' in lifecycle
          assert "VERIFIED|BLOCKED|ESCALATED|DELIVERED" in lifecycle
          assert "candidate_artifact_id" in lifecycle
          assert "repair_round" in lifecycle
          assert "R1_REPAIR_ROUND" in lifecycle
          assert "R2_REPAIR_ROUND" in lifecycle
          assert 'repair_round="$R1_REPAIR_ROUND"' in lifecycle
          assert 'repair_round="$R2_REPAIR_ROUND"' in lifecycle

          assert "lifecycle_handoff" in delivery
          assert "outputs.state == 'VERIFIED'" in delivery
          assert "Resolve verified Delivery handoff" in delivery
          assert "needs.lifecycle_handoff.outputs.candidate_artifact_name" in delivery
          assert "needs.lifecycle_handoff.outputs.worker_handoff_artifact_name" in delivery
          assert "Commit/push or reuse exact verified Candidate branch" in delivery
          assert 'python3 "$root/trusted-delivery.py" ensure-branch' in delivery
          assert 'python3 "$root/trusted-delivery.py" ensure-pr' in delivery
          assert "contents: write" in delivery
          assert "issues: write" not in delivery
          assert "pull-requests: write" in delivery
          assert "secrets." not in delivery
          assert "opencode run" not in delivery
          assert "provider_api_key" not in delivery
          assert "opencode_go_api_key" not in delivery
          assert "--expected-repair-round \"$EXPECTED_REPAIR_ROUND\"" in delivery

          assert "lifecycle_handoff" in recovery_index
          assert "candidate_origin_repair_round" in recovery_index
          assert "lifecycle_state" in recovery_index
          assert "validation_result" in recovery_index
          assert "mira-recovery-candidate:v1" in recovery_index
          assert "issues: write" in recovery_index
          assert "contents: none" in recovery_index
          assert "recovered_candidate_upload_outcome == 'success'" in recovery_index
          assert "recovered_verify_upload_outcome == 'success'" in recovery_index

          assert "contract_drift" in worker
          assert "escalated" in worker
          assert "steps.recovery.outputs.mode == 'contract_drift'" in worker
          assert "steps.recovery.outputs.mode == 'escalated'" in worker

          for stage in ("initial_repair_outcome", "repair_round_1", "repair_round_2", "lifecycle_handoff"):
              assert f"      - {stage}" in reporter
          assert "continue-on-error: true" in reporter

          assert not any(line.strip().startswith("timeout-minutes:") and "inputs.timeout_minutes" in line for line in workflow.splitlines())
          assert "default: 60" in workflow
          assert "SOFT_BUDGET_MINUTES: $" + "{{ inputs.timeout_minutes }}" in worker
          assert "NOT a hard deadline" in runtime
          exact = "https://raw.githubusercontent.com/" + "$" + "{{ job.workflow_repository }}/" + "$" + "{{ job.workflow_sha }}"
          assert exact + "/.github/scripts/worker-candidate/recovery.py" in worker
          assert exact + "/.github/scripts/worker-validation/validation.py" in worker
          assert exact + "/.github/scripts/worker-runtime/run-worker.sh" in worker
          assert exact + "/.github/scripts/worker-repair/repair.py" in repair
          assert exact + "/.github/scripts/worker-candidate/candidate.py" in repair

          assert delivery.index("Assert verified Candidate identity") < delivery.index("Commit/push or reuse exact verified Candidate branch")
          assert delivery.index("Commit/push or reuse exact verified Candidate branch") < delivery.index("Create Draft PR with durable handoff")
          PY

  fixture-worker-capture:
    permissions:
      contents: read
      issues: none
      pull-requests: none
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base_sha: ${{ steps.identity.outputs.base_sha }}
      patch_sha256: ${{ steps.capture.outputs.patch_sha256 }}
      tree_oid: ${{ steps.capture.outputs.tree_oid }}
      contract_fingerprint: ${{ steps.capture.outputs.contract_fingerprint }}
      artifact_name: ${{ steps.capture.outputs.artifact_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Freeze fixture base
        id: identity
        shell: bash
        run: echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Simulate Worker change
        shell: bash
        run: |
          set -euo pipefail
          printf 'AGT-058 clean-runner fixture\n' > agt-058-fixture.txt

      - name: Capture fixture Candidate
        id: capture
        shell: bash
        env:
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/agt-058-candidate"
          artifact_name="agt-058-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fingerprint="sha256:7a8d5d36f993f834675c21ef6a838e37d949cebac22ea50a299f2b27686381e8"

          python3 .github/scripts/worker-candidate/candidate.py capture \
            --repo "$GITHUB_WORKSPACE" \
            --output "$out" \
            --repository "$GITHUB_REPOSITORY" \
            --issue-number 58 \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --base-branch main \
            --base-sha "$BASE_SHA" \
            --contract-fingerprint "$fingerprint" \
            --worker-outcome success \
            --provider fixture \
            --model fixture-model

          {
            echo "artifact_name=$artifact_name"
            echo "patch_sha256=$(jq -r '.candidate_patch_sha256' "$out/candidate.json")"
            echo "tree_oid=$(jq -r '.candidate_tree_oid' "$out/candidate.json")"
            echo "contract_fingerprint=$(jq -r '.contract_fingerprint' "$out/candidate.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Upload fixture Candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.capture.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/agt-058-candidate/candidate.patch
            ${{ runner.temp }}/agt-058-candidate/candidate.json
          if-no-files-found: error
          retention-days: 1

  fixture-verify:
    needs: fixture-worker-capture
    permissions:
      contents: read
      issues: none
      pull-requests: none
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      patch_sha256: ${{ steps.restore.outputs.patch_sha256 }}
      tree_oid: ${{ steps.restore.outputs.tree_oid }}
      verification_artifact_name: ${{ steps.evidence.outputs.artifact_name }}
    steps:
      - name: Checkout exact fixture base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.fixture-worker-capture.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download fixture Candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.fixture-worker-capture.outputs.artifact_name }}
          path: ${{ runner.temp }}/agt-058-verify/candidate

      - name: Restore Candidate in clean Verify Runner
        id: restore
        shell: bash
        env:
          BASE_SHA: ${{ needs.fixture-worker-capture.outputs.base_sha }}
          CONTRACT_FINGERPRINT: ${{ needs.fixture-worker-capture.outputs.contract_fingerprint }}
          EXPECTED_PATCH: ${{ needs.fixture-worker-capture.outputs.patch_sha256 }}
          EXPECTED_TREE: ${{ needs.fixture-worker-capture.outputs.tree_oid }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/agt-058-verify"
          python3 .github/scripts/worker-candidate/candidate.py restore \
            --repo "$GITHUB_WORKSPACE" \
            --candidate-dir "$root/candidate" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-issue-number 58 \
            --expected-base-sha "$BASE_SHA" \
            --expected-contract-fingerprint "$CONTRACT_FINGERPRINT"

          patch="$(jq -r '.candidate_patch_sha256' "$root/candidate/candidate.json")"
          tree="$(jq -r '.candidate_tree_oid' "$root/candidate/candidate.json")"
          test "$patch" = "$EXPECTED_PATCH"
          test "$tree" = "$EXPECTED_TREE"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          {
            echo "patch_sha256=$patch"
            echo "tree_oid=$tree"
          } >> "$GITHUB_OUTPUT"

      - name: Run fixture repository verification
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat agt-058-fixture.txt)" = "AGT-058 clean-runner fixture"
          git diff --check

      - name: Write Verify evidence
        id: evidence
        shell: bash
        env:
          PATCH_SHA256: ${{ steps.restore.outputs.patch_sha256 }}
          TREE_OID: ${{ steps.restore.outputs.tree_oid }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/agt-058-verify"
          artifact_name="agt-058-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg patch "$PATCH_SHA256" \
            --arg tree "$TREE_OID" \
            '{terminal_status:"success", candidate_patch_sha256:$patch, candidate_tree_oid:$tree}' \
            > "$root/verify-run.json"

      - name: Upload Verify evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.evidence.outputs.artifact_name }}
          path: ${{ runner.temp }}/agt-058-verify/verify-run.json
          if-no-files-found: error
          retention-days: 1

  fixture-verify-tamper:
    needs: fixture-worker-capture
    permissions:
      contents: read
      issues: none
      pull-requests: none
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact fixture base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.fixture-worker-capture.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download fixture Candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.fixture-worker-capture.outputs.artifact_name }}
          path: ${{ runner.temp }}/agt-058-tamper/candidate

      - name: Prove tampered Candidate fails closed
        shell: bash
        env:
          BASE_SHA: ${{ needs.fixture-worker-capture.outputs.base_sha }}
          CONTRACT_FINGERPRINT: ${{ needs.fixture-worker-capture.outputs.contract_fingerprint }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/agt-058-tamper"
          printf '\n# tamper\n' >> "$root/candidate/candidate.patch"
          set +e
          python3 .github/scripts/worker-candidate/candidate.py restore \
            --repo "$GITHUB_WORKSPACE" \
            --candidate-dir "$root/candidate" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-issue-number 58 \
            --expected-base-sha "$BASE_SHA" \
            --expected-contract-fingerprint "$CONTRACT_FINGERPRINT" \
            > "$root/stdout" 2> "$root/stderr"
          rc="$?"
          set -e
          test "$rc" -eq 2
          grep -q "digest mismatch" "$root/stderr"

  fixture-verification-failure:
    needs: fixture-worker-capture
    permissions:
      contents: read
      issues: none
      pull-requests: none
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact fixture base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.fixture-worker-capture.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download preserved Candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.fixture-worker-capture.outputs.artifact_name }}
          path: ${{ runner.temp }}/agt-058-verify-failure/candidate

      - name: Restore Candidate before intentional verification failure
        shell: bash
        env:
          BASE_SHA: ${{ needs.fixture-worker-capture.outputs.base_sha }}
          CONTRACT_FINGERPRINT: ${{ needs.fixture-worker-capture.outputs.contract_fingerprint }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/agt-058-verify-failure"
          python3 .github/scripts/worker-candidate/candidate.py restore \
            --repo "$GITHUB_WORKSPACE" \
            --candidate-dir "$root/candidate" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-issue-number 58 \
            --expected-base-sha "$BASE_SHA" \
            --expected-contract-fingerprint "$CONTRACT_FINGERPRINT"
          test "$(git write-tree)" = "${{ needs.fixture-worker-capture.outputs.tree_oid }}"

      - name: Record intentional repository verification failure
        id: verification_failure
        continue-on-error: true
        shell: bash
        run: exit 17

      - name: Assert Candidate remains preserved and Delivery is forbidden
        shell: bash
        env:
          VERIFY_OUTCOME: ${{ steps.verification_failure.outcome }}
        run: |
          set -euo pipefail
          test "$VERIFY_OUTCOME" = failure
          test -s "${RUNNER_TEMP}/agt-058-verify-failure/candidate/candidate.patch"
          test -s "${RUNNER_TEMP}/agt-058-verify-failure/candidate/candidate.json"
          printf '{"terminal_status":"failure","candidate_preserved":true,"delivery_allowed":false}\n' > verify-failure.json
          jq -e '.terminal_status == "failure" and .candidate_preserved == true and .delivery_allowed == false' verify-failure.json >/dev/null

  fixture-delivery-failure:
    needs:
      - fixture-worker-capture
      - fixture-verify
    permissions:
      contents: read
      issues: none
      pull-requests: none
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout workflow under test
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assert Delivery phase has verified Candidate and no model authority
        shell: bash
        env:
          WORKER_PATCH: ${{ needs.fixture-worker-capture.outputs.patch_sha256 }}
          WORKER_TREE: ${{ needs.fixture-worker-capture.outputs.tree_oid }}
          VERIFY_PATCH: ${{ needs.fixture-verify.outputs.patch_sha256 }}
          VERIFY_TREE: ${{ needs.fixture-verify.outputs.tree_oid }}
        run: |
          set -euo pipefail
          test "$WORKER_PATCH" = "$VERIFY_PATCH"
          test "$WORKER_TREE" = "$VERIFY_TREE"
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path(".github/workflows/mira-external-worker.yml").read_text()
          delivery = workflow[workflow.index("\n  delivery:"):workflow.index("\n  recovery_index:")]
          assert "opencode run" not in delivery
          assert "opencode_go_api_key" not in delivery
          assert "provider_api_key" not in delivery
          assert "secrets." not in delivery
          PY

      - name: Simulate GitHub Delivery failure after Verify PASS
        id: delivery_failure
        continue-on-error: true
        shell: bash
        run: exit 23

      - name: Assert failure is isolated to Delivery
        shell: bash
        env:
          DELIVERY_OUTCOME: ${{ steps.delivery_failure.outcome }}
        run: |
          set -euo pipefail
          test "$DELIVERY_OUTCOME" = failure
          printf '{"verify":"success","delivery":"failure","model_rerun_required":false}\n' > delivery-failure.json
          jq -e '.verify == "success" and .delivery == "failure" and .model_rerun_required == false' delivery-failure.json >/dev/null

  fixture-delivery:
    needs:
      - fixture-worker-capture
      - fixture-verify
    permissions:
      contents: read
      issues: none
      pull-requests: none
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact fixture base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.fixture-worker-capture.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact Candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.fixture-worker-capture.outputs.artifact_name }}
          path: ${{ runner.temp }}/agt-058-delivery/candidate

      - name: Download Verify evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.fixture-verify.outputs.verification_artifact_name }}
          path: ${{ runner.temp }}/agt-058-delivery/verify

      - name: Restore and commit exact verified Candidate locally
        shell: bash
        env:
          BASE_SHA: ${{ needs.fixture-worker-capture.outputs.base_sha }}
          CONTRACT_FINGERPRINT: ${{ needs.fixture-worker-capture.outputs.contract_fingerprint }}
          WORKER_PATCH: ${{ needs.fixture-worker-capture.outputs.patch_sha256 }}
          WORKER_TREE: ${{ needs.fixture-worker-capture.outputs.tree_oid }}
          VERIFY_PATCH: ${{ needs.fixture-verify.outputs.patch_sha256 }}
          VERIFY_TREE: ${{ needs.fixture-verify.outputs.tree_oid }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/agt-058-delivery"
          git switch -c agt-058-local-delivery
          python3 .github/scripts/worker-candidate/candidate.py restore \
            --repo "$GITHUB_WORKSPACE" \
            --candidate-dir "$root/candidate" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-issue-number 58 \
            --expected-base-sha "$BASE_SHA" \
            --expected-contract-fingerprint "$CONTRACT_FINGERPRINT"

          manifest_patch="$(jq -r '.candidate_patch_sha256' "$root/candidate/candidate.json")"
          manifest_tree="$(jq -r '.candidate_tree_oid' "$root/candidate/candidate.json")"
          verify_status="$(jq -r '.terminal_status' "$root/verify/verify-run.json")"
          test "$verify_status" = success
          test "$manifest_patch" = "$WORKER_PATCH"
          test "$manifest_patch" = "$VERIFY_PATCH"
          test "$manifest_tree" = "$WORKER_TREE"
          test "$manifest_tree" = "$VERIFY_TREE"
          test "$(git write-tree)" = "$manifest_tree"

          git config user.name "Mira Delivery Fixture"
          git config user.email "fixture@example.invalid"
          git commit -qm "fixture: exact verified candidate"
          test "$(git rev-parse HEAD^{tree})" = "$manifest_tree"


  fixture-recovery-base-advance:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Recovery tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prove clean 3-way continuation and conflict fail-closed
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/agt-059-base"
          mkdir -p "$root"

          make_repo() {
            local repo="$1"
            mkdir -p "$repo"
            git -C "$repo" init -q
            git -C "$repo" config user.name "Mira Recovery Fixture"
            git -C "$repo" config user.email "fixture@example.invalid"
            printf 'base\n' > "$repo/work.txt"
            printf 'stable\n' > "$repo/unrelated.txt"
            git -C "$repo" add -A
            git -C "$repo" commit -qm base
          }

          # Candidate from base, then base advances in a non-conflicting file.
          clean="$root/clean"
          make_repo "$clean"
          base_sha="$(git -C "$clean" rev-parse HEAD)"
          printf 'candidate\n' > "$clean/work.txt"
          python3 .github/scripts/worker-candidate/candidate.py capture \
            --repo "$clean" \
            --output "$root/clean-candidate" \
            --repository "uichat-mira/recovery-fixture" \
            --issue-number 59 \
            --run-id 1 \
            --run-attempt 1 \
            --base-branch main \
            --base-sha "$base_sha" \
            --contract-fingerprint "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            --worker-outcome failure
          git -C "$clean" reset --hard -q "$base_sha"
          printf 'advanced\n' > "$clean/unrelated.txt"
          git -C "$clean" add -A
          git -C "$clean" commit -qm "advance unrelated"
          current_sha="$(git -C "$clean" rev-parse HEAD)"
          git -C "$clean" merge-base --is-ancestor "$base_sha" "$current_sha"
          git -C "$clean" apply --3way --index --whitespace=nowarn -- "$root/clean-candidate/candidate.patch"
          git -C "$clean" reset -q
          test "$(cat "$clean/work.txt")" = candidate
          test "$(cat "$clean/unrelated.txt")" = advanced
          git -C "$clean" diff --check
          echo "PASS Recovery base advance: clean 3-way continuation"

          # Candidate and current base both change the same line differently.
          conflict="$root/conflict"
          make_repo "$conflict"
          conflict_base="$(git -C "$conflict" rev-parse HEAD)"
          printf 'candidate-side\n' > "$conflict/work.txt"
          python3 .github/scripts/worker-candidate/candidate.py capture \
            --repo "$conflict" \
            --output "$root/conflict-candidate" \
            --repository "uichat-mira/recovery-fixture" \
            --issue-number 59 \
            --run-id 2 \
            --run-attempt 1 \
            --base-branch main \
            --base-sha "$conflict_base" \
            --contract-fingerprint "sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb" \
            --worker-outcome failure
          git -C "$conflict" reset --hard -q "$conflict_base"
          printf 'current-side\n' > "$conflict/work.txt"
          git -C "$conflict" add -A
          git -C "$conflict" commit -qm "advance conflicting"
          set +e
          git -C "$conflict" apply --3way --index --whitespace=nowarn -- "$root/conflict-candidate/candidate.patch" \
            >"$root/conflict.stdout" 2>"$root/conflict.stderr"
          conflict_rc="$?"
          set -e
          test "$conflict_rc" -ne 0
          git -C "$conflict" reset --hard -q HEAD
          git -C "$conflict" clean -fdq
          test "$(cat "$conflict/work.txt")" = current-side
          echo "PASS Recovery base advance: conflict fails closed"
