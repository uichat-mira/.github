name: Dispatch Worker 41

# regression-dispatch: trusted maintainer comments 2026-10-07

on:
  push:
    branches:
      - dispatch/41-worker
    paths:
      - .github/workflows/dispatch-41-worker.yml

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  worker:
    uses: uichat-mira/.github/.github/workflows/mira-external-worker.yml@165a2ad2c86c1f9f32d2b7785cffac55c28ac5ad
    with:
      issue_number: 41
      base_branch: main
      verification_command: |
        git diff --check
        ruby -e 'require "yaml"; YAML.load_file(".github/ISSUE_TEMPLATE/work-item.yml")'
    secrets:
      opencode_go_api_key: ${{ secrets.AI_PROVIDER_OPENCODE_GO_KEY }}
